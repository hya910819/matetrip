                '<td class="tiny">' + r.best + '위</td><td class="tiny">' + U.esc(r.updated || '오늘 09:00') + '</td></tr>';
            }).join('') +
          '</tbody></table>' +
          '<div class="stat-tiles">' +
            '<div class="stat-tile"><span>평균 노출 순위</span><b>' + avg + '위 <em class="' + (avg < prevAvg ? 'up' : 'down') + '">' + (avg < prevAvg ? '▲' : '▼') + Math.abs(prevAvg - avg) + '</em></b></div>' +
            '<div class="stat-tile"><span>일 방문자</span><b>' + U.fmtNum(c.exposure.views) + ' <em class="up">▲3.2%</em></b></div>' +
            '<div class="stat-tile"><span>블로그 리뷰</span><b>' + U.fmtNum(c.exposure.blogReviews) + '</b></div>' +
            '<div class="stat-tile"><span>방문자 리뷰</span><b>' + U.fmtNum(c.exposure.visitorReviews) + '</b></div>' +
          '</div>' +
        '</div>' +
        '<div class="report-card" style="margin-top:14px">' +
          '<h3>월별 운영 실적 <span class="rc-sub">최근 6개월</span></h3>' +
          Charts.bars({ a: MONTHLY.applications, b: MONTHLY.selected }, MONTHLY.labels) +
          '<div class="chart-legend" style="margin-top:6px"><span><i style="background:#2f4bff"></i>신청</span><span><i style="background:#c9d3f0"></i>선정</span></div>' +
          '<div class="stat-tiles" style="grid-template-columns:repeat(3,1fr)">' +
            '<div class="stat-tile"><span>이번 달 신청</span><b>' + MONTHLY.applications[5] + '건</b></div>' +
            '<div class="stat-tile"><span>선정</span><b>' + MONTHLY.selected[5] + '건</b></div>' +
            '<div class="stat-tile"><span>검수 완료 리뷰</span><b>' + MONTHLY.reviews[5] + '건</b></div>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div>' +
        '<div class="report-card">' +
          '<h3>' + U.esc(c.store) + ' 요약</h3>' +
          '<div class="tiny" style="margin-top:3px;color:var(--muted-2)">' + U.esc(c.area) + ' · ' + U.esc(c.category) + '</div>' +
          '<div style="display:flex;gap:14px;margin-top:13px;align-items:center">' +
            '<div style="width:92px;height:92px;border-radius:50%;background:conic-gradient(#2f4bff ' + Math.max(6, 100 - c.exposure.rank) + '%, #eef1f8 0);display:grid;place-items:center;position:relative">' +
              '<div style="position:absolute;inset:9px;background:#fff;border-radius:50%"></div>' +
              '<div style="position:relative;text-align:center"><b style="font-size:22px;font-weight:800">' + c.exposure.rank + '</b><div class="tiny">위</div></div>' +
            '</div>' +
            '<div><div style="font-size:12px;font-weight:800">‘' + U.esc(c.exposure.keyword) + '’</div>' +
              '<div class="tiny" style="margin-top:3px">전일 ' + c.exposure.prev + '위 → 오늘 ' + c.exposure.rank + '위</div>' +
              '<div class="tiny" style="margin-top:2px;color:var(--green);font-weight:800">' + (c.exposure.prev > c.exposure.rank ? '▲ ' + (c.exposure.prev - c.exposure.rank) + '계단 상승' : '변동 없음') + '</div></div>' +
          '</div>' +
          '<div class="stat-tiles">' +
            '<div class="stat-tile"><span>확정 / 모집</span><b>' + Store.capacityOf(c).confirmed + ' / ' + Store.capacityOf(c).capacity + '</b></div>' +
            '<div class="stat-tile"><span>이번 달 신청</span><b>' + Store.appsOfCampaign(c.id).length + '건</b></div>' +
          '</div>' +
        '</div>' +
        '<div class="report-card" style="margin-top:14px">' +
          '<h3>리뷰 검수 현황 <span class="rc-sub">전체 캠페인</span></h3>' +
          '<div class="stat-tiles" style="grid-template-columns:1fr 1fr">' +
            '<div class="stat-tile"><span>제출</span><b>' + Store.state.reviews.length + '건</b></div>' +
            '<div class="stat-tile"><span>통과</span><b style="color:var(--green)">' + Store.state.reviews.filter(function (r){ return r.adminStatus === 'passed'; }).length + '건</b></div>' +
            '<div class="stat-tile"><span>수정 요청</span><b style="color:#c77a00">' + Store.state.reviews.filter(function (r){ return r.adminStatus === 'fix'; }).length + '건</b></div>' +
            '<div class="stat-tile"><span>검수 대기</span><b>' + Store.state.reviews.filter(function (r){ return r.adminStatus === 'submitted'; }).length + '건</b></div>' +
          '</div>' +
          '<div class="tiny" style="margin-top:9px">통과율 <b style="color:var(--ink)">' + Math.round(Store.state.reviews.filter(function (r){ return r.adminStatus === 'passed'; }).length / Math.max(1, Store.state.reviews.length) * 100) + '%</b> · 자동 검수가 1차로 걸러 담당자는 예외만 확인합니다.</div>' +
        '</div>' +
        '<div class="report-card" style="margin-top:14px">' +
          '<h3>리포트 내보내기</h3>' +
          '<p class="tiny" style="margin-top:5px;line-height:1.6">월간 리포트는 인쇄(PDF)로 저장해 광고주에게 전달할 수 있습니다.</p>' +
          '<div style="display:flex;gap:6px;margin-top:10px"><button class="btn ghost sm" data-act="printReport">' + icon('print') + 'PDF 저장</button>' +
          '<button class="btn ghost sm" data-act="copyReport">' + icon('copy') + '카톡용 요약 복사</button></div>' +
        '</div>' +
      '</div>' +
    '</div>';
  },

  /* ------------------------------------------------------------ VIP 인재풀 */
  poolTab: function (){
    var f = App.poolFilter;
    var list = CREATORS.filter(function (c){
      if (f.grade && c.grade !== f.grade) return false;
      if (f.media && c.media.indexOf(f.media) < 0) return false;
      return true;
    }).sort(function (a, b){
      var oa = GRADES[a.grade].order, ob = GRADES[b.grade].order;
      if (oa !== ob) return ob - oa;
      return b.manner - a.manner;
    });
    var invited = Store.state.invitations.length;
    return '<div class="panel" style="margin-bottom:12px"><div class="panel-head">' +
        '<h3>' + icon('crown') + 'VIP 인재풀 <span class="tiny">' + list.length + '명</span></h3>' +
        '<div class="panel-tools">' +
          '<button class="chip ' + (!f.grade ? 'on' : '') + '" data-act="poolGrade" data-k="">등급 전체</button>' +
          GRADE_ORDER.slice().reverse().map(function (k){
            return '<button class="chip ' + (f.grade === k ? 'on' : '') + '" data-act="poolGrade" data-k="' + k + '">' + GRADES[k].name + '</button>';
          }).join('') +
          '<span class="sel"><select data-act="poolMedia"><option value="">매체 전체</option>' +
            MEDIA_ORDER.map(function (m){ return '<option value="' + m + '"' + (f.media === m ? ' selected' : '') + '>' + MEDIA[m].short + '</option>'; }).join('') +
          '</select></span>' +
          '<span class="pill">' + icon('send') + '이번 달 재초대 ' + invited + '건</span>' +
        '</div></div>' +
      '<div style="padding:12px 15px;border-bottom:1px solid var(--line-2);background:#fbfcff" class="tiny">' +
        icon('spark') + ' <b style="color:var(--ink)">자동 추천</b> · 매너 4.6 이상 &amp; 최근 30일 협업 완료 크리에이터는 상단에 우선 배치됩니다.' +
      '</div>' +
      '<div style="padding:14px"><div class="pool-grid">' +
        list.map(function (cr){
          var g = Store.grade(cr.grade);
          var isInvited = Store.state.invitations.some(function (i){ return i.creatorId === cr.id; });
          return '<div class="pool-card">' +
            '<div class="pc-top"><span class="avatar" style="background:linear-gradient(135deg,' + g.color + ',' + g.color2 + ')">' + U.esc(U.initials(cr.name)) + '</span>' +
              '<div class="pc-id"><b>' + U.esc(cr.name) + ' <span class="gb ' + g.key + '">' + g.badge + '</span></b><span>' + U.esc(cr.handle) + ' · ' + U.esc(cr.region) + '</span></div></div>' +
            '<div class="pc-stats">' +
              '<div><span>매너</span><b>' + cr.manner.toFixed(1) + '</b></div>' +
              '<div><span>완료</span><b>' + cr.done + '회</b></div>' +
              '<div><span>노쇼</span><b style="color:' + (cr.noshow ? '#c33' : 'inherit') + '">' + cr.noshow + '회</b></div>' +
            '</div>' +
            '<div class="pc-tags">' + cr.media.map(function (m){ return '<span class="media-chip">' + mediaIcon(m) + MEDIA[m].short + '</span>'; }).join('') +
              '<span class="tag">' + U.esc(cr.category) + '</span>' +
              '<span class="tag">최근 ' + U.esc(cr.lastCollab || '-') + '</span></div>' +
            '<div class="pc-actions">' +
              '<button class="btn ghost xs" data-act="openCreator" data-id="' + cr.id + '">' + icon('users') + '이력 보기</button>' +
              '<button class="btn ' + (isInvited ? 'soft' : 'primary') + ' xs" data-act="invite" data-id="' + cr.id + '">' + (isInvited ? '초대 완료' : '재초대') + '</button>' +
            '</div>' +
          '</div>';
        }).join('') +
      '</div></div>' +
    '</div>';
  },

  /* ------------------------------------------------------------------ 페이지 */
  render: function (){
    var t = Store.state.ui.adminTab || 'apps';
    var tabs = [
      { k: 'apps', n: '신청 관리', i: 'users', cnt: Store.state.applications.filter(function (a){ return a.status === 'review'; }).length },
      { k: 'reviews', n: '리뷰 검수', i: 'shield', cnt: Store.state.reviews.filter(function (r){ return r.adminStatus === 'submitted'; }).length },
      { k: 'campaigns', n: '캠페인·지점', i: 'grid' },
      { k: 'report', n: '성과 리포트', i: 'chart' },
      { k: 'pool', n: 'VIP 인재풀', i: 'crown' }
    ];
    var body = t === 'reviews' ? ViewAdmin.reviewsTab() : (t === 'campaigns' ? ViewAdmin.campaignsTab() : (t === 'report' ? ViewAdmin.reportTab() : (t === 'pool' ? ViewAdmin.poolTab() : ViewAdmin.appsTab())));
    return '<div class="page page-admin">' +
      '<div class="admin-head">' +
        '<div><span class="eyebrow gold"><span class="dot"></span>GROWTH KOREA · ADMIN</span>' +
          '<h1 style="margin-top:8px">통합 관리자</h1>' +
          '<p>신청자 선정 · 자동 검수 · 성과 리포트를 한 화면에서 처리합니다.</p></div>' +
        '<div class="admin-actions">' +
          '<button class="btn ghost sm" data-act="openSettings">' + icon('sync') + (Hook.enabled() ? '시트 연결됨' : '시트 연동 (데모)') + '</button>' +
          '<button class="btn dark sm" data-act="refreshData">' + icon('refresh') + '새로고침</button>' +
        '</div>' +
      '</div>' +
      ViewAdmin.kpiRow() +
      '<div class="admin-tabs">' + tabs.map(function (tb){
        return '<button class="' + (t === tb.k ? 'on' : '') + '" data-act="adminTab" data-tab="' + tb.k + '">' + icon(tb.i) + tb.n + (tb.cnt ? '<span class="cnt">' + tb.cnt + '</span>' : '') + '</button>';
      }).join('') + '</div>' +
      body +
    '</div>';
  },

  /* --------------------------------------------------- 신청자 상세 모달 */
  applicantModal: function (a){
    var cr = Store.creator(a.creatorId) || {};
    var c = Store.campaign(a.campaignId) || {};
    var br = a.branchId ? Store.branchOf(c, a.branchId) : null;
    var g = Store.grade(cr.grade);
    var apps = Store.appsOf(a.creatorId);
    var m = Store.matchOf(a);
    return '<div class="settings-body">' +
      '<div style="display:flex;align-items:center;gap:11px;padding-right:30px">' +
        '<span class="avatar" style="width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,' + g.color + ',' + g.color2 + ')">' + U.esc(U.initials(cr.name)) + '</span>' +
        '<div style="flex:1;min-width:0"><div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap"><h2 style="font-size:17px;margin:0">' + U.esc(cr.name) + '</h2><span class="gb ' + g.key + '">' + g.badge + '</span></div>' +
        '<div class="tiny">' + U.esc(cr.handle) + ' · ' + U.esc(cr.region) + ' · ' + U.esc(cr.category) + '</div></div>' +
        ViewMy.statusPill(a.status) +
      '</div>' +
      '<div class="stat-tiles" style="grid-template-columns:repeat(3,1fr);margin-top:14px">' +
        '<div class="stat-tile"><span>매너 점수</span><b>' + Number(cr.manner).toFixed(1) + '</b></div>' +
        '<div class="stat-tile"><span>완료 캠페인</span><b>' + cr.done + '회</b></div>' +
        '<div class="stat-tile"><span>노쇼</span><b>' + cr.noshow + '회</b></div>' +
      '</div>' +
      '<div class="settings-sec"><h3>' + icon('spark') + '자동 매칭 점수 <span class="tiny" style="font-weight:700;margin-left:4px">' + m.score + '점 · ' + m.meta.label + '</span></h3>' +
        ViewAdmin.matchPanel(a, m) +
      '</div>' +
      '<div class="settings-sec"><h3>' + icon('send') + '신청 정보</h3>' +
        '<div class="map-table" style="margin-top:8px">' +
          '<div><b>캠페인</b><span>' + U.esc(c.store) + ' · ' + U.esc(c.campaignName) + (br ? ' (' + U.esc(br.name) + ')' : '') + '</span></div>' +
          '<div><b>매체</b><span>' + U.esc(MEDIA[a.media].name) + '</span></div>' +
          '<div><b>채널</b><span style="word-break:break-all">' + U.esc(a.url || '-') + '</span></div>' +
          '<div><b>연락처</b><span>' + U.esc(a.contact || '-') + '</span></div>' +
          '<div><b>방문 희망</b><span>' + (a.visitAt ? U.fmtMD(a.visitAt) + ' ' + U.esc(a.visitTime || '') : '미정') + '</span></div>' +
          '<div><b>접수</b><span>' + U.fmtMD(a.appliedAt) + '</span></div>' +
        '</div>' +
        (a.note ? '<p class="tiny" style="margin-top:7px">메모: ' + U.esc(a.note) + '</p>' : '') +
      '</div>' +
      '<div class="settings-sec"><h3>' + icon('star') + '이 크리에이터의 최근 신청</h3>' +
        '<div style="margin-top:6px">' + apps.slice(0, 4).map(function (x){
          var cc = Store.campaign(x.campaignId) || {};
          return '<div class="be-row" style="border-bottom:1px solid var(--line-2)"><b style="min-width:0;flex:1">' + U.esc(cc.store || '') + '</b><span class="tiny">' + U.fmtMD(x.appliedAt) + '</span>' + ViewMy.statusPill(x.status) + '</div>';
        }).join('') + '</div>' +
      '</div>' +
      '<div class="settings-sec"><h3>' + icon('spark') + '매너 평가 남기기</h3>' +
        '<div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap" id="mannerStars">' +
          [1, 2, 3, 4, 5].map(function (n){ return '<button class="chip" data-act="mannerStar" data-n="' + n + '" style="height:30px">' + n + '점</button>'; }).join('') +
        '</div>' +
        '<div class="field" style="margin-top:8px"><input class="input" id="mannerComment" placeholder="예: 시간 약속을 잘 지켰고 사진이 깔끔했습니다."></div>' +
        '<button class="btn primary sm" style="margin-top:8px" data-act="saveManner" data-id="' + a.id + '">평가 저장</button>' +
      '</div>' +
      '<div class="form-actions" style="margin-top:16px">' +
        (a.status === 'review' ? '<button class="btn ghost" data-act="setStatus" data-id="' + a.id + '" data-status="rejected">제외</button><button class="btn primary" data-act="setStatus" data-id="' + a.id + '" data-status="selected">선정하기</button>' : '') +
        (a.status === 'selected' ? '<button class="btn ghost" data-act="setStatus" data-id="' + a.id + '" data-status="visited">방문 완료 처리</button><button class="btn danger" data-act="setStatus" data-id="' + a.id + '" data-status="noshow">노쇼 기록</button>' : '') +
        '<button class="btn soft" data-act="invite" data-id="' + a.creatorId + '" data-campaign="' + a.campaignId + '">' + icon('send') + '재초대</button>' +
      '</div>' +
    '</div>';
  }
};

</script>
<script>
/* =========================================================================
   메이트립 (MATETRIP) v2 — 앱 컨트롤러 (라우팅 · 이벤트 · 모달 · 폼)
   ========================================================================= */
'use strict';

var App = {
  filters: { q: '', media: '', region: '', brand: '', visitType: '', multi: false, gradeOnly: false, benefit: '', sort: '마감 임박순' },
  adminApps: { campaign: '', brand: '', status: '', media: '', matchGrade: '', sort: 'score' },
  adminSelected: [],
  poolFilter: { grade: '', media: '' },
  reportCampaign: 'CMP-001',
  reviewAppId: null,
  reviewDraft: null,
  applyCtx: null,
  mannerStars: 0,
  _inspectTimer: null,
  _searchTimer: null,

  /* ------------------------------------------------------------------ 초기화 */
  init: function (){
    Store.load();
    var qMode = U.qs('mode');
    if (qMode && ['explore', 'my', 'admin'].indexOf(qMode) >= 0) Store.state.ui.mode = qMode;
    var qTab = U.qs('tab');
    if (qTab === 'review') { Store.state.ui.mode = 'my'; Store.state.ui.myTab = 'review'; }
    if (qTab && ['apps', 'reviews', 'campaigns', 'report', 'pool'].indexOf(qTab) >= 0) Store.state.ui.adminTab = qTab;
    var qApp = U.qs('app');
    if (qApp) { App.reviewAppId = qApp; Store.state.ui.mode = 'my'; Store.state.ui.myTab = 'review'; }
    App.bind();
    App.render();
  },

  bind: function (){
    document.addEventListener('click', App.onClick);
    document.addEventListener('change', App.onChange);
    document.addEventListener('input', App.onInput);
    document.addEventListener('submit', App.onSubmit);
    document.addEventListener('keydown', function (e){
      if (e.key === 'Escape') App.closeModal();
      if ((e.key === 'Enter' || e.key === ' ') && document.activeElement && document.activeElement.classList.contains('camp-card')) {
        e.preventDefault();
        App.onClick({ target: document.activeElement });
      }
    });
  },

  /* -------------------------------------------------------------------- 렌더 */
  render: function (){
    Store.save();
    var mode = Store.state.ui.mode || 'explore';
    var main = document.getElementById('main');
    if (!main) return;
    if (mode === 'my') main.innerHTML = ViewMy.render();
    else if (mode === 'admin') main.innerHTML = ViewAdmin.render();
    else main.innerHTML = ViewExplore.render();
    App.updateChrome();
    if (mode === 'explore') App.updateCount();
  },

  updateChrome: function (){
    var mode = Store.state.ui.mode || 'explore';
    Array.prototype.forEach.call(document.querySelectorAll('[data-act="mode"]'), function (b){
      b.classList.toggle('on', b.getAttribute('data-mode') === mode);
    });
    var v = Store.viewer();
    var g = Store.grade(v.grade);
    var vb = document.getElementById('viewerBtn');
    if (vb) {
      vb.innerHTML = '<span class="avatar" style="background:linear-gradient(135deg,' + g.color + ',' + g.color2 + ')">' + U.esc(U.initials(v.name)) + '</span>' +
        '<span class="viewer-meta"><b>' + U.esc(v.name) + '</b><span>' + g.name + ' · ' + v.manner.toFixed(1) + '</span></span>' +
        '<span class="caret">' + icon('chevronDown') + '</span>';
    }
    var sp = document.getElementById('syncPill');
    if (sp) {
      sp.className = 'sync-pill' + (Hook.enabled() ? ' live' : '');
      sp.innerHTML = '<span class="dot"></span>' + (Hook.enabled() ? '시트 연동' : '데모 모드');
    }
  },

  updateCount: function (){
    var el = document.getElementById('fCount');
    if (el) el.textContent = ViewExplore.filtered().length;
  },

  toast: function (msg, isErr){
    var t = document.getElementById('toast');
    if (!t) return;
    t.className = 'toast' + (isErr ? ' err' : '');
    t.innerHTML = icon(isErr ? 'alert' : 'check') + '<span>' + U.esc(msg) + '</span>';
    t.classList.add('on');
    clearTimeout(App._toastTimer);
    App._toastTimer = setTimeout(function (){ t.classList.remove('on'); }, 2600);
  },

  fallbackCopy: function (text, done){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done && done(); } catch (e) { App.toast('복사에 실패했습니다. 직접 선택해 주세요.', true); }
    document.body.removeChild(ta);
  },

  /* ------------------------------------------------------------------- 모달 */
  openModal: function (html, opts){
    opts = opts || {};
    var root = document.getElementById('modalRoot');
    if (!root) return;
    root.innerHTML = '<div class="modal open" role="dialog" aria-modal="true">' +
      '<div class="modal-backdrop" data-act="closeModal"></div>' +
      '<div class="modal-dialog ' + (opts.size || '') + '">' +
        '<button class="modal-x" data-act="closeModal" aria-label="닫기">' + icon('x') + '</button>' +
        '<div class="modal-scroll">' + html + '</div>' +
      '</div></div>';
    document.body.style.overflow = 'hidden';
    if (opts.after) setTimeout(opts.after, 30);
  },
  closeModal: function (){
    var root = document.getElementById('modalRoot');
    if (root) root.innerHTML = '';
    document.body.style.overflow = '';
  },

  /* ------------------------------------------------------------------ 변경 */
  onChange: function (e){
    var t = e.target;
    var act = t.getAttribute && t.getAttribute('data-act');
    if (act === 'selectApp') {
      var id = t.getAttribute('data-id');
      if (t.checked) { if (App.adminSelected.indexOf(id) < 0) App.adminSelected.push(id); }
      else App.adminSelected = App.adminSelected.filter(function (x){ return x !== id; });
      var tr = t.closest('tr'); if (tr) tr.classList.toggle('picked', t.checked);
      App.renderBulkbar();
      return;
    }
    if (act === 'selectAll') {
      var on = t.checked;
      App.adminSelected = on ? ViewAdmin.rows().map(function (r){ return r.app.id; }) : [];
      App.render();
      return;
    }
    if (act === 'adminStatusFilter') { App.adminApps.status = t.value; App.render(); return; }
    if (act === 'adminCampaignFilter') { App.adminApps.campaign = t.value; App.render(); return; }
    if (act === 'adminMediaFilter') { App.adminApps.media = t.value; App.render(); return; }
    if (act === 'adminMatchSort') { App.adminApps.sort = t.value; App.render(); return; }
    if (act === 'poolMedia') { App.poolFilter.media = t.value; App.render(); return; }
    if (act === 'applyMedia') {
      App.applyCtx.media = t.value;
      var c = Store.campaign(App.applyCtx.campaignId);
      var mf = document.getElementById('mediaFields');
      if (mf && c) mf.innerHTML = ViewExplore.mediaFields(t.value, c);
      return;
    }
    if (t.id === 'fGrade') { App.filters.gradeOnly = t.checked; App.render(); return; }
    if (t.id === 'fBenefit') { App.filters.benefit = t.value; App.render(); return; }
    if (t.id === 'fRegion') { App.filters.region = t.value; App.render(); return; }
    if (t.id === 'fBrand') { App.filters.brand = t.value; App.render(); return; }
    if (t.id === 'fSort') { App.filters.sort = t.value; App.render(); return; }
    if (t.id === 'adminNote') {
      var rv = Store.state.reviews.filter(function (r){ return r.id === App.adminReviewId; })[0];
      if (rv) { rv.adminNote = t.value; Store.save(); }
      return;
    }

  validateApply: function (form, c){
    var errs = {};
    var name = form.querySelector('#aName');
    var contact = form.querySelector('#aContact');
    var url = form.querySelector('#aUrl');
    var visit = form.querySelector('#aVisitDate');
    var visitTime = form.querySelector('#aVisitTime');
    var consent = form.querySelector('#aConsent');
    var media = App.applyCtx.media;
    function setErr(input, key, msg){
      errs[key] = msg;
      if (input) input.setAttribute('aria-invalid', 'true');
    }
    Array.prototype.forEach.call(form.querySelectorAll('[aria-invalid]'), function (i){ i.removeAttribute('aria-invalid'); });
    if (!name.value.trim()) setErr(name, 'eName', '활동명을 입력해 주세요.');
    if (!contact.value.trim()) setErr(contact, 'eContact', '연락처를 입력해 주세요.');
    var urlVal = url.value.trim();
    if (!urlVal) setErr(url, 'eUrl', '채널 주소를 입력해 주세요.');
    else {
      var norm = /^https?:\/\//i.test(urlVal) ? urlVal : 'https://' + urlVal;
      if (!MEDIA[media].urlPattern.test(norm)) setErr(url, 'eUrl', MEDIA[media].name + ' 주소 형식이 아닙니다. (' + MEDIA[media].urlHint + ')');
    }
    if (!visit.value) setErr(visit, 'eVisit', '방문 일을 선택해 주세요.');
    else if (c.visitType !== 'free') {
      if (!visitTime || !visitTime.value) {
        setErr(visitTime, 'eTime', '방문 시간을 선택해 주세요.');
      }
      var tpart = visitTime ? visitTime.value : '';
      var tm = U.timeToMin(tpart || '00:00');
      var hit = (c.blocked || []).some(function (b){
        var f = U.timeToMin(b.from), to = U.timeToMin(b.to);
        if (to <= f) to += 1440;
        return (tm < to && tm + 60 > f) || (tm + 1440 < to && tm + 1440 + 60 > f);
      });
      if (hit) {
        var b0 = (c.blocked || [])[0];
        setErr(visitTime, 'eTime', '선택한 시간은 제외 시간대입니다. (' + b0.label + ' ' + b0.from + '~' + b0.to + ')');
      }
    }
    if (!consent.checked) setErr(consent, 'eConsent', '개인정보 수집·이용에 동의해 주세요.');
    return errs;
  },

  submitApply: function (form){
    var c = Store.campaign(App.applyCtx.campaignId);
    var errs = App.validateApply(form, c);
    Array.prototype.forEach.call(form.querySelectorAll('.err'), function (e){ e.textContent = ''; });
    var keys = Object.keys(errs);
    if (keys.length) {
      keys.forEach(function (k){
        var e = document.getElementById(k);
        if (e) e.textContent = errs[k];
      });
      var fe = document.getElementById('formError');
      var ft = document.getElementById('formErrorText');
      if (fe && ft) {
        fe.classList.add('on');
        ft.textContent = keys.length + '개 항목을 확인해 주세요. ' + errs[keys[0]];
      }
      var first = form.querySelector('[aria-invalid="true"]');
      if (first) first.focus();
      return;
    }
    var btn = document.getElementById('submitApply');
    if (btn) { btn.disabled = true; btn.textContent = '전송 중…'; }
    var media = App.applyCtx.media;
    var visitVal = form.querySelector('#aVisitDate').value;
    var timeEl = form.querySelector('#aVisitTime');
    var timeVal = timeEl ? timeEl.value : '';
    var data = {
      campaignId: c.id,
      branchId: c.multi ? App.applyCtx.branch : '',
      media: media,
      name: form.querySelector('#aName').value.trim(),
      contact: form.querySelector('#aContact').value.trim(),
      url: form.querySelector('#aUrl').value.trim(),
      blogType: (form.querySelector('input[name="blogType"]:checked') || {}).value || '',
      visitors: Number((form.querySelector('#aVisitors') || {}).value || 0),
      posts: Number((form.querySelector('#aPosts') || {}).value || 0),
      followers: Number((form.querySelector('#aFollowers') || {}).value || 0),
      avgViews: Number((form.querySelector('#aViews') || {}).value || 0),
      visitAt: visitVal || '',
      visitTime: timeVal || ''
    };
    var payload = {
      campaignId: c.id,
      store: c.store,
      campaignName: c.campaignName,
      branchName: c.multi ? (Store.branchOf(c, data.branchId) || {}).name : '',
      media: MEDIA[media].name,
      bloggerName: data.name,
      contact: data.contact,
      blogUrl: data.url,
      blogType: data.blogType || (media === 'blog' ? '' : '인플'),
      followers: data.followers,
      visitors: data.visitors,
      posts: data.posts,
      visitDate: data.visitAt + (data.visitTime ? ' ' + data.visitTime : ''),
      grade: Store.grade(Store.viewer().grade).name,
      consent: 'Y',
      consentVersion: '2026-11-26'
    };
    var finish = function (res){
      var app = Store.addApplication(data);
      if (res && res.id) app.receiptNo = res.id;
      var root = document.getElementById('modalRoot');
      if (root) {
        root.innerHTML = '<div class="modal open" role="dialog" aria-modal="true"><div class="modal-backdrop" data-act="closeModal"></div>' +
          '<div class="modal-dialog narrow"><button class="modal-x" data-act="closeModal" aria-label="닫기">' + icon('x') + '</button>' +
          '<div class="modal-scroll">' + ViewExplore.done(app, c, { synced: !!(res && res.ok && res.id) }) + '</div></div></div>';
      }
      App.toast(res && res.ok && res.id ? '신청서가 시트로 전송되었습니다.' : '신청이 접수되었습니다. (데모 저장)');
    };
    if (Hook.enabled()) {
      Hook.send('submit', payload, function (res){
        if (res && res.ok) finish(res);
        else {
          if (btn) { btn.disabled = false; btn.innerHTML = '신청서 제출' + icon('send'); }
          var fe = document.getElementById('formError');
          var ft = document.getElementById('formErrorText');
          if (fe && ft) {
            fe.classList.add('on');
            ft.textContent = (res && res.message) || '접수 서버에 연결하지 못했습니다. 잠시 후 다시 시도해 주세요.';
          }
        }
      });
    } else {
      setTimeout(function (){ finish(null); }, 260);
    }
  },

      ];

      }
      if (MEDIA[app.media].minChars > 400) {

      } else {
        d.body += '\n' + c.keywords.tags.join(' ');
      }

      d.body = '오늘 ' + c.store + ' 다녀왔는데 분위기 좋고 맛있었어요. 다음에 또 갈 것 같습니다. 사진도 몇 장 찍었는데 다 올리지 못했네요.';
      d.url = goodUrl;
      d.checklist = { photos: 2, receipt: false, visitProof: false, hashtags: false, disclosure: false };
    }
    App.render();
    App.toast(kind === 'good' ? '통과 예시를 불러왔습니다.' : '미흡 예시를 불러왔습니다. 검수 결과를 확인해 보세요.');

  submitReview: function (id){
    var app = Store.app(id);
    if (!app || !App.reviewDraft) return;
    var d = App.reviewDraft;
    if (!String(d.url || '').trim()) { App.toast('포스팅 링크를 입력해 주세요.', true); return; }
    if (!String(d.body || '').trim()) { App.toast('본문을 입력해 주세요.', true); return; }
    var c = Store.campaign(app.campaignId);
    var result = Inspector.run(d, c);
    var rv = Store.addReview({
      appId: app.id, campaignId: c.id, creatorId: app.creatorId, media: app.media,
      url: d.url, title: d.title, body: d.body, checklist: d.checklist, result: result
    });
    var payload = {
      campaignId: c.id, store: c.store, bloggerName: Store.viewer().name, media: MEDIA[app.media].name,
      postUrl: d.url, title: d.title, body: String(d.body).slice(0, 4000),
      keywords: result.items.filter(function (i){ return i.key === 'main'; })[0].status === 'pass' ? 'O' : 'X',
      fairness: result.items.filter(function (i){ return i.key === 'fair'; })[0].status === 'pass' ? 'O' : 'X',
      hours: result.items.filter(function (i){ return i.key === 'hours'; })[0].status === 'pass' ? 'O' : 'X',
      score: result.score, verdict: result.status, fixes: result.fixes.join(' / ')
    };
    if (Hook.enabled()) Hook.send('review', payload, function (res){
      if (res && res.ok) App.toast('검수 결과가 시트로 전송되었습니다.');
    });
    App.reviewDraft = null;
    App.reviewAppId = null;
    App.render();
    setTimeout(function (){
      App.openModal(ViewMy.resultModal(Store.app(id)), { size: 'narrow' });
    }, 60);
    App.toast(result.score + '점 · ' + (result.status === 'pass' ? '검수 통과' : result.status === 'fix' ? '수정 항목이 있습니다' : '다시 작성이 필요합니다'), result.status !== 'pass');

        '<div><b>2_모집_선정_스케줄</b><span>신청 접수 · 상태 변경 (13열 그대로)</span></div>' +
        '<div><b>3_포스팅_검수</b><span>리뷰 제출 · 검수 결과 (12열)</span></div>' +
        '<div><b>4_키워드_노출_순위</b><span>성과 리포트 (읽기)</span></div>' +
        '<div><b>5_신청_상세 (신규)</b><span>매체 · 지점 · 등급 · 채널 지표</span></div>' +
        '<div><b>6_크리에이터_멤버 (신규)</b><span>등급 · 매너 점수</span></div>' +
        '<div><b>7_매너평가 (신규)</b><span>상호 평가 · 노쇼 기록</span></div>' +
        '<div><b>8_재초대_로그 (신규)</b><span>VIP 재초대 이력</span></div>' +
      '</div></div>' +
      '<div class="settings-sec"><h3>' + icon('refresh') + '데모 데이터</h3><p class="tiny" style="margin-top:4px">신청·리뷰·평가 기록을 처음 상태로 되돌립니다.</p>' +
      '<button class="btn danger sm" style="margin-top:8px" data-act="resetDemo">데모 데이터 초기화</button></div>' +
    '</div>', { size: 'narrow' });
  },

  saveSettings: function (){
    var u = (document.getElementById('hookUrl') || {}).value || '';
    var k = (document.getElementById('hookKey') || {}).value || '';
    Store.state.settings.webhookUrl = u.trim();
    Store.state.settings.secretKey = k.trim();
    Store.save();
    App.updateChrome();
    App.toast(u.trim() ? '웹훅 주소를 저장했습니다.' : '데모 모드로 전환했습니다.');
    App.closeModal();
  },

  testHook: function (){
    var u = (document.getElementById('hookUrl') || {}).value || '';
    if (!u.trim()) { App.toast('웹앱 URL을 먼저 입력해 주세요.', true); return; }
    var prev = Store.state.settings.webhookUrl;
    Store.state.settings.webhookUrl = u.trim();
    App.toast('연결을 확인하고 있습니다…');
    Hook.send('ping', {}, function (res){
      Store.state.settings.webhookUrl = prev;
      if (res && res.ok) App.toast('연결 성공 · ' + (res.service || '메이트립') + ' 서버 응답 확인');
      else App.toast('연결 실패 · ' + ((res && res.message) || '주소와 배포 설정을 확인해 주세요.'), true);
    });
  },

  resetDemo: function (){
    Store.reset();
    App.reviewDraft = null;
    App.reviewAppId = null;
    App.adminSelected = [];
    App.closeModal();
    App.render();
    App.toast('데모 데이터를 초기화했습니다.');
  },

  refreshData: function (){
    if (!Hook.enabled()) { App.toast('데모 데이터 기준으로 새로고침했습니다.'); App.render(); return; }
    App.toast('시트에서 데이터를 불러오는 중…');
    Hook.send('bootstrap', {}, function (res){
      if (!res || !res.ok) { App.toast('시트를 불러오지 못했습니다. ' + ((res && res.message) || ''), true); return; }
      if (res.campaigns && res.campaigns.length) {
        res.campaigns.forEach(function (x){
          var c = Store.campaign(x.id);
          if (!c) return;
          var cs = Store.state.campaignState[c.id] || {};
          if (x.capacity != null) cs.capacity = Number(x.capacity);
          if (x.paused != null) cs.paused = !!x.paused;
          Store.state.campaignState[c.id] = cs;
        });
      }
      Store.save();
      App.render();
      App.toast('시트 데이터를 반영했습니다. (' + ((res.campaigns || []).length) + '개 캠페인)');
    });
  },

  /* ------------------------------------------------------------- 다운로드/복사 */
  exportCsv: function (){
    var rows = ViewAdmin.rows();
    var head = ['캠페인ID', '매장명', '지점', '크리에이터', '등급', '매칭점수', '추천등급', '매칭사유', '매체', '연락처', '채널', '방문희망', '상태', '매너', '접수일'];
    var lines = [head.join(',')];
    rows.forEach(function (row){
      var a = row.app, m = row.match;
      var c = Store.campaign(a.campaignId) || {};
      var cr = Store.creator(a.creatorId) || {};
      var br = a.branchId ? Store.branchOf(c, a.branchId) : null;
      var cells = [a.campaignId, c.store || '', br ? br.name : '', cr.name || '', (GRADES[cr.grade] || {}).name || '', m.score, m.grade, m.reasonText, MEDIA[a.media].name, a.contact || '', a.url || '', (a.visitAt || '') + ' ' + (a.visitTime || ''), (STATUS_META[a.status] || {}).label || '', cr.manner || '', a.appliedAt];
      lines.push(cells.map(function (x){ return '"' + String(x == null ? '' : x).replace(/"/g, '""') + '"'; }).join(','));
    });
    var blob = new Blob(['\ufeff' + lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
    var a2 = document.createElement('a');
    a2.href = URL.createObjectURL(blob);
    a2.download = 'matetrip-신청내역-' + U.iso(U.today()) + '.csv';
    document.body.appendChild(a2);
    a2.click();
    setTimeout(function (){ URL.revokeObjectURL(a2.href); a2.remove(); }, 400);
    App.toast(rows.length + '건을 CSV로 내려받았습니다.');
  },

  copyReport: function (){
    var c = Store.campaign(App.reportCampaign) || CAMPAIGNS[0];
    var ranks = KEYWORD_RANKS[c.id] || KEYWORD_RANKS['CMP-001'];
    var lines = ['[' + c.store + ' 성과 리포트] ' + U.fmtFull(U.iso(U.today())),
      '· 메인 키워드 ‘' + c.exposure.keyword + '’ ' + c.exposure.rank + '위 (전일 ' + c.exposure.prev + '위)',
      '· 일 방문자 ' + U.fmtNum(c.exposure.views) + ' · 블로그 리뷰 ' + U.fmtNum(c.exposure.blogReviews) + ' · 방문자 리뷰 ' + U.fmtNum(c.exposure.visitorReviews),
      '· 모집 ' + Store.capacityOf(c).confirmed + '/' + Store.capacityOf(c).capacity + ' · 이번 달 신청 ' + Store.appsOfCampaign(c.id).length + '건',
      '· 키워드 순위: ' + ranks.map(function (r){ return r.keyword + ' ' + r.rank + '위'; }).join(', '),
      '· 검수 통과율 ' + Math.round(Store.state.reviews.filter(function (r){ return r.adminStatus === 'passed'; }).length / Math.max(1, Store.state.reviews.length) * 100) + '%'
    ];
    U.copy(lines.join('\n'), '카톡용 요약을 복사했습니다.');
  }
};

document.addEventListener('DOMContentLoaded', App.init);

</script>
</body>
</html>
