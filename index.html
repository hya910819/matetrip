<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="그로스코리아(GROWTH KOREA)가 운영하는 로컬 맛집·핫플 체험단 플랫폼, 메이트립(MATETRIP). 등급별 혜택, 블로그·릴스·쇼츠·틱톡 통합 모집, 리뷰 자동 검수, 다지점 캠페인, 성과 리포트까지 한곳에서.">
<meta property="og:type" content="website">
<meta property="og:title" content="메이트립 MATETRIP | 로컬 맛집·핫플 체험단 · GROWTH KOREA">
<meta property="og:description" content="등급이 높을수록 더 자주 무료로. 블로그·릴스·쇼츠·틱톡 통합 체험단 플랫폼, 메이트립.">

<style>
/* =========================================================================
   메이트립 (MATETRIP) v2 — stylesheet
   ========================================================================= */
:root{
  --primary:#2f4bff; --primary-2:#6a4dff; --primary-700:#1f37d6;
  --primary-050:#eef1ff; --primary-100:#dfe5ff;
  --ink:#0e1526; --ink-2:#26304a; --muted:#5b667e; --muted-2:#8a93a7;
  --line:#e7eaf3; --line-2:#f1f3f9; --bg:#f4f6fb; --surface:#fff;
  --green:#0b9b6b; --green-bg:#e8f8f1;
  --red:#d93a3a; --red-bg:#fdeeee;
  --amber:#a86a00; --amber-bg:#fff4e0;
  --violet:#7a4dff; --violet-bg:#f1ecff;
  --shadow-xs:0 1px 2px rgba(14,21,38,.05);
  --shadow-sm:0 2px 6px rgba(14,21,38,.05), 0 1px 2px rgba(14,21,38,.04);
  --shadow-md:0 14px 30px -18px rgba(21,34,74,.35), 0 4px 10px -6px rgba(21,34,74,.12);
  --shadow-lg:0 40px 80px -30px rgba(16,26,58,.42), 0 12px 26px -16px rgba(16,26,58,.2);
  --r-xl:26px; --r-lg:20px; --r-md:14px; --r-sm:10px;
  --topbar-h:68px; --max:1240px;
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR","Noto Sans CJK KR","Helvetica Neue",Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:15px;line-height:1.6;letter-spacing:-.012em;
  word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased;
}
img,svg{max-width:100%}
.i{width:16px;height:16px;flex:0 0 auto;display:inline-block;vertical-align:-3px}
.tiny .i,.tag .i,summary .i{width:12px;height:12px;vertical-align:-2px}
h1,h2,h3,h4,h5,p,ul,ol,figure,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
table{border-collapse:collapse;width:100%}
:focus-visible{outline:3px solid rgba(47,75,255,.4);outline-offset:2px;border-radius:8px}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hidden{display:none!important}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.02em}
.num{font-variant-numeric:tabular-nums}

/* ============================ top bar ================================== */
.topbar{position:sticky;top:0;z-index:70;background:rgba(255,255,255,.88);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid rgba(231,234,243,.9)}
.topbar-inner{max-width:var(--max);margin:0 auto;padding:0 22px;height:var(--topbar-h);display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:11px;flex:0 0 auto}
.brand-mark{width:36px;height:36px;border-radius:12px;background:linear-gradient(140deg,#2f4bff,#7a5cff);display:grid;place-items:center;box-shadow:0 8px 18px -10px rgba(47,75,255,.9);flex:0 0 auto}
.brand-mark svg{width:19px;height:19px;display:block}
.brand-text{display:flex;flex-direction:column;line-height:1.12}
.brand-text strong{font-size:15.5px;font-weight:800;letter-spacing:.08em}
.brand-text span{font-size:10.5px;font-weight:700;color:var(--muted-2);letter-spacing:.06em}
.brand-v{font-size:9.5px;font-weight:800;color:var(--primary);background:var(--primary-050);border:1px solid var(--primary-100);padding:1px 5px;border-radius:6px;margin-left:2px;vertical-align:2px;letter-spacing:0}
.modes{display:flex;align-items:center;gap:4px;background:#f2f4fa;border:1px solid var(--line);padding:4px;border-radius:14px;margin-left:6px}
.modes button{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 15px;border-radius:10px;font-size:13.5px;font-weight:700;color:var(--muted);transition:.16s;white-space:nowrap}
.modes button svg{width:16px;height:16px;stroke-width:1.9}
.modes button:hover{color:var(--ink)}
.modes button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow-sm)}
.modes button.on svg{color:var(--primary)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0}
.sync-pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:999px;background:#f7f8fc;border:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.sync-pill .dot{width:7px;height:7px;border-radius:50%;background:#f0b429;box-shadow:0 0 0 3px rgba(240,180,41,.16)}
.sync-pill.live .dot{background:var(--green);box-shadow:0 0 0 3px rgba(11,155,107,.14)}
.viewer-btn{display:flex;align-items:center;gap:9px;height:42px;padding:0 8px 0 6px;border-radius:999px;border:1px solid var(--line);background:#fff;transition:.16s;max-width:250px}
.viewer-btn:hover{border-color:#cfd6e8;box-shadow:var(--shadow-sm)}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:800;color:#fff;background:linear-gradient(135deg,#4a5a74,#202a3d);flex:0 0 auto;letter-spacing:0}
.viewer-meta{display:flex;flex-direction:column;align-items:flex-start;line-height:1.18;min-width:0}
.viewer-meta b{font-size:12.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.viewer-meta span{font-size:10.5px;color:var(--muted-2);font-weight:700}
.viewer-btn .caret{width:13px;height:13px;color:var(--muted-2);flex:0 0 auto}
.icon-btn{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:var(--muted);border:1px solid transparent;transition:.16s}
.icon-btn:hover{background:#f2f4fa;color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.tabbar{display:none}

/* ============================ layout ================================== */
.main{max-width:var(--max);margin:0 auto;padding:0 22px 80px}
.page{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.eyebrow{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 12px 0 9px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:11.5px;font-weight:800;letter-spacing:.02em;color:#3d4a66;box-shadow:var(--shadow-xs)}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 3px rgba(47,75,255,.14)}
.eyebrow.gold{color:#7a5200;background:#fffbef;border-color:#f6e6b8}
.eyebrow.gold .dot{background:#e6a700;box-shadow:0 0 0 3px rgba(230,167,0,.15)}
.section-head{margin:34px 0 16px;display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}
.section-head h2{font-size:20px;font-weight:800;letter-spacing:-.03em;margin-top:10px}
.section-head p{font-size:13px;color:var(--muted);margin-top:5px}
.muted{color:var(--muted)}
.tiny{font-size:11.5px;color:var(--muted-2);font-weight:600}
.grad{background:linear-gradient(96deg,#2f4bff 8%,#7a5cff 58%,#a05cff 96%);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ============================ buttons ================================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:44px;padding:0 18px;border-radius:12px;font-size:14px;font-weight:700;letter-spacing:-.01em;transition:.16s;white-space:nowrap;border:1px solid transparent}
.btn svg{width:16px;height:16px;flex:0 0 auto}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(135deg,#2f4bff,#5b48ff);color:#fff;box-shadow:0 12px 22px -14px rgba(47,75,255,.95)}
.btn.primary:hover{box-shadow:0 16px 28px -14px rgba(47,75,255,1);transform:translateY(-1px)}
.btn.dark{background:var(--ink);color:#fff}
.btn.dark:hover{background:#1b2438}
.btn.ghost{background:#fff;border-color:var(--line);color:var(--ink-2);box-shadow:var(--shadow-xs)}
.btn.ghost:hover{border-color:#cbd3e6;background:#fcfdff}
.btn.soft{background:var(--primary-050);color:var(--primary-700);border-color:var(--primary-100)}
.btn.soft:hover{background:#e6ebff}
.btn.danger{background:#fff;border-color:#f2cfcf;color:#bf2f2f}
.btn.danger:hover{background:#fdf4f4}
.btn.sm{height:36px;padding:0 13px;font-size:12.5px;border-radius:10px}
.btn.xs{height:30px;padding:0 10px;font-size:11.5px;border-radius:9px;gap:5px}
.btn.xs svg{width:13px;height:13px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.btn-link{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:var(--primary);padding:4px 2px}
.btn-link svg{width:14px;height:14px}
.btn-link:hover{text-decoration:underline}
.link-quiet{color:var(--muted);font-size:12px;font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* ============================ badges/chips ============================= */
.gb{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:6px;font-size:10px;font-weight:800;letter-spacing:.04em;color:#fff;white-space:nowrap}
.gb.black{background:linear-gradient(135deg,#151a26,#414b63)}
.gb.diamond{background:linear-gradient(135deg,#2f6df6,#63c4ff)}
.gb.red{background:linear-gradient(135deg,#e2384f,#ff8a5c)}
.gb.yellow{background:linear-gradient(135deg,#e8a800,#ffd35c);color:#3d2b00}
.badge{display:inline-flex;align-items:center;gap:4px;height:23px;padding:0 8px;border-radius:7px;font-size:11px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.badge.dday{background:#fff;color:#c92a2a}
.badge.dday.soon{background:#d93a3a;color:#fff}
.badge.type{background:rgba(14,21,38,.72);color:#fff;backdrop-filter:blur(4px)}
.badge.type.free{background:rgba(11,155,107,.92)}
.badge.multi{background:rgba(255,255,255,.9);color:#4b3bd6}
.badge.ghost{background:#f2f4fa;color:var(--muted);font-weight:700}
.chip{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:700;color:var(--muted);transition:.14s;white-space:nowrap}
.chip:hover{border-color:#cbd3e6;color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .n{font-size:10.5px;font-weight:800;color:inherit;opacity:.62}
.chip .m-dot{width:6px;height:6px;border-radius:50%}
.media-chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 7px 0 5px;border-radius:6px;font-size:10.5px;font-weight:800;background:#f5f7fc;border:1px solid #ecf0f8;color:#3f4b64}
.media-chip svg{width:12px;height:12px}
.media-chip.on{background:var(--primary-050);border-color:var(--primary-100);color:var(--primary-700)}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 7px;border-radius:6px;background:#f6f8fd;border:1px solid #eef1f9;font-size:11px;font-weight:700;color:#4c5872}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:800;background:#f4f6fc;color:#4b5670}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.st{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:7px;font-size:11px;font-weight:800;white-space:nowrap}
.st .dot{width:5px;height:5px;border-radius:50%;background:currentColor}
.st-review{background:#f1f3f9;color:#5b667e}
.st-selected{background:var(--primary-050);color:var(--primary-700)}
.st-visited{background:var(--violet-bg);color:#5b34d6}
.st-submitted{background:var(--amber-bg);color:var(--amber)}
.st-passed{background:var(--green-bg);color:var(--green)}
.st-fix{background:#fff1f0;color:#c33}
.st-rejected{background:#f4f5f8;color:#8a93a7}
.st-noshow{background:#fdecec;color:#c92a2a}

/* ============================ explore hero ============================= */
.ex-hero{position:relative;margin:18px 0 0;padding:34px 34px 30px;border-radius:var(--r-xl);overflow:hidden;background:
  radial-gradient(900px 380px at 6% -20%, #e4eaff 0%, rgba(228,234,255,0) 60%),
  radial-gradient(760px 340px at 96% -10%, #efe9ff 0%, rgba(239,233,255,0) 58%),
  linear-gradient(180deg,#fbfcff,#f7f9ff);
  border:1px solid #e9edf8}
.ex-hero::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(47,75,255,.1) 1px, transparent 1px);background-size:22px 22px;
  -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.7),rgba(0,0,0,0) 70%);mask-image:linear-gradient(180deg,rgba(0,0,0,.7),rgba(0,0,0,0) 70%)}
.ex-hero-inner{position:relative;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr);gap:30px;align-items:center}
.ex-copy h1{margin:14px 0 0;font-size:clamp(27px,3.1vw,40px);line-height:1.22;letter-spacing:-.045em;font-weight:800}
.ex-copy .lead{margin-top:13px;font-size:14.5px;color:#4c5872;max-width:34em;line-height:1.7}
.hero-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}
.hero-meta{display:flex;flex-wrap:wrap;gap:7px 16px;margin-top:18px;font-size:12.5px;color:#5a6580;font-weight:600}
.hero-meta li{display:flex;align-items:center;gap:6px}
.hero-meta svg{width:13px;height:13px;color:var(--green);stroke-width:3}

/* grade card */
.grade-card{position:relative;border-radius:22px;padding:20px;color:#fff;overflow:hidden;box-shadow:0 24px 44px -26px rgba(20,30,70,.6)}
.grade-card::after{content:"";position:absolute;right:-40px;top:-50px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.1)}
.grade-card::before{content:"";position:absolute;left:-30px;bottom:-70px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.07)}
.grade-card.g-red{background:linear-gradient(140deg,#e2384f,#ff7a5c)}
.grade-card.g-black{background:linear-gradient(140deg,#111624,#3b4560)}
.grade-card.g-diamond{background:linear-gradient(140deg,#2f6df6,#5cc8ff)}
.grade-card.g-yellow{background:linear-gradient(140deg,#e8a800,#ffd35c);color:#3a2900}
.gc-top{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px}
.gc-label{font-size:11px;font-weight:800;letter-spacing:.08em;opacity:.85}
.gc-emblem{font-size:10px;font-weight:900;letter-spacing:.14em;padding:3px 8px;border-radius:6px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.25)}
.grade-card.g-yellow .gc-emblem{background:rgba(255,255,255,.45);border-color:rgba(255,255,255,.5)}
.gc-name{position:relative;margin-top:12px;font-size:19px;font-weight:800;display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.gc-name small{font-size:11.5px;font-weight:600;opacity:.72;letter-spacing:0}
.gc-tagline{position:relative;font-size:11.5px;opacity:.78;margin-top:2px;font-weight:600}
.gc-stats{position:relative;display:flex;gap:14px;margin-top:14px}
.gc-stats div{display:flex;flex-direction:column}
.gc-stats b{font-size:17px;font-weight:800;line-height:1.2}
.gc-stats span{font-size:10.5px;opacity:.75;font-weight:600}
.gc-meter{position:relative;margin-top:14px;background:rgba(0,0,0,.22);height:6px;border-radius:99px;overflow:hidden}
.grade-card.g-yellow .gc-meter{background:rgba(255,255,255,.5)}
.gc-meter i{display:block;height:100%;border-radius:99px;background:#fff}
.gc-meter-label{position:relative;display:flex;justify-content:space-between;font-size:10px;font-weight:700;opacity:.82;margin-top:5px}
.gc-link{position:relative;display:inline-flex;align-items:center;gap:5px;margin-top:13px;font-size:11.5px;font-weight:800;opacity:.9}
.gc-link svg{width:13px;height:13px}
.gc-link:hover{opacity:1;text-decoration:underline}

/* ============================ filters ================================= */
.filter-shell{position:sticky;top:calc(var(--topbar-h) + 8px);z-index:40;margin:18px 0 4px;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:11px 13px;box-shadow:var(--shadow-sm)}
.filter-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.filter-row + .filter-row{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line-2)}
.search{position:relative;flex:1 1 220px;min-width:180px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted-2)}
.search input{width:100%;height:34px;padding:0 12px 0 33px;border-radius:9px;border:1px solid var(--line);background:#fbfcfe;font-size:13px}
.search input::placeholder{color:#9aa3b8}
.search input:focus{outline:none;border-color:#bfcbf0;background:#fff;box-shadow:0 0 0 3px rgba(47,75,255,.09)}
.sel{position:relative;display:inline-flex;align-items:center}
.sel select{height:32px;padding:0 28px 0 10px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:600;color:#43506b;appearance:none;-webkit-appearance:none;cursor:pointer}
.sel select:focus{outline:none;border-color:#bfcbf0;box-shadow:0 0 0 3px rgba(47,75,255,.09)}
.sel::after{content:"";position:absolute;right:10px;top:50%;width:6px;height:6px;border-right:1.6px solid #7b859b;border-bottom:1.6px solid #7b859b;transform:translateY(-70%) rotate(45deg);pointer-events:none}
.toggle{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 11px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{position:absolute;opacity:0;pointer-events:none}
.toggle .tk{width:28px;height:16px;border-radius:99px;background:#dfe3ee;position:relative;transition:.16s;flex:0 0 auto}
.toggle .tk::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:.16s;box-shadow:0 1px 2px rgba(0,0,0,.18)}
.toggle input:checked + .tk{background:var(--primary)}
.toggle input:checked + .tk::after{transform:translateX(12px)}
.toggle:has(input:checked){border-color:var(--primary-100);background:var(--primary-050);color:var(--primary-700)}
.filter-count{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--muted-2);white-space:nowrap}
.filter-count b{color:var(--ink)}
.filters-empty{padding:46px 0;text-align:center;color:var(--muted)}
.filters-empty b{display:block;font-size:16px;color:var(--ink);margin-bottom:6px}

/* ============================ brand shelf ============================== */
.shelf{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:14px}
.shelf-card{position:relative;border-radius:14px;padding:13px 13px 12px;background:#fff;border:1px solid var(--line);transition:.16s;overflow:hidden;text-align:left}
.shelf-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:#d8dff0}
.shelf-card .sc-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.shelf-dot{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:10px;font-weight:900;color:#fff}
.shelf-card b{display:block;font-size:13px;font-weight:800;margin-top:9px;letter-spacing:-.02em}
.shelf-card span{display:block;font-size:10.5px;color:var(--muted-2);font-weight:600;margin-top:1px}
.shelf-card .sc-n{font-size:10px;font-weight:800;color:var(--primary-700);background:var(--primary-050);padding:2px 6px;border-radius:5px}
.shelf-card.multi{border-color:#e3ddff;background:linear-gradient(180deg,#fbfaff,#fff)}

/* ============================ campaign cards =========================== */
.cards-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px}
.camp-card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s;display:flex;flex-direction:column;text-align:left}
.camp-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:#d9e0f2}
.card-cover{position:relative;height:126px;padding:12px 13px;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.card-cover::after{content:"";position:absolute;right:-46px;top:-56px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.13)}
.card-cover::before{content:"";position:absolute;left:-30px;bottom:-64px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.09)}
.cover-top{position:relative;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.cover-brand{font-size:11px;font-weight:800;letter-spacing:.04em;opacity:.92}
.cover-badges{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.cover-bottom{position:relative}
.cover-bottom h3{font-size:17px;font-weight:800;letter-spacing:-.03em;line-height:1.24}
.cover-bottom span{font-size:11px;opacity:.82;font-weight:600}
.card-body{padding:13px 14px 14px;display:flex;flex-direction:column;gap:9px;flex:1}
.card-campaign{font-size:12.5px;font-weight:700;color:#4a5670;line-height:1.4}
.benefit-line{display:flex;align-items:flex-start;gap:6px;flex-wrap:wrap;font-size:12px}
.grade-benefit{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:5px;background:var(--primary-050);color:var(--primary-700);font-size:10.5px;font-weight:800;white-space:nowrap}
.grade-benefit.dim{background:#f4f5f9;color:#7b859b}
.grade-benefit.point{background:#fff6e5;color:#a86a00}
.benefit-name{color:#3f4b64;font-weight:600;line-height:1.45}
.media-row{display:flex;gap:4px;flex-wrap:wrap}
.card-meta{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted-2);font-weight:700;margin-top:auto}
.cap-bar{flex:1;height:5px;background:#eef1f8;border-radius:99px;overflow:hidden;min-width:40px}
.cap-bar i{display:block;height:100%;background:linear-gradient(90deg,#2f4bff,#7a5cff);border-radius:99px}
.cap-bar i.full{background:linear-gradient(90deg,#d93a3a,#ff7a5c)}
.card-meta b{color:var(--ink);font-weight:800}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:9px;border-top:1px dashed var(--line-2);font-size:11px}
.card-foot .kw{color:#7b859b;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-foot .go{display:inline-flex;align-items:center;gap:3px;color:var(--primary);font-weight:800;flex:0 0 auto}
.card-foot .go svg{width:12px;height:12px}
.closed{opacity:.72}
.closed .card-cover{filter:saturate(.5)}

/* ============================ detail modal ============================= */
.modal{position:fixed;inset:0;z-index:120;display:none}
.modal.open{display:block}
.modal-backdrop{position:absolute;inset:0;background:rgba(10,16,30,.52);backdrop-filter:blur(3px);animation:fade .18s ease}
.modal-dialog{position:relative;margin:4vh auto;width:min(920px,calc(100vw - 32px));max-height:92vh;background:#fff;border-radius:24px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;overflow:hidden;animation:pop .24s cubic-bezier(.2,.8,.3,1)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.modal-dialog.wide{width:min(1080px,calc(100vw - 32px))}
.modal-dialog.narrow{width:min(560px,calc(100vw - 32px))}
.modal-scroll{overflow-y:auto;overscroll-behavior:contain;flex:1}
.modal-x{position:absolute;right:14px;top:14px;z-index:6;width:34px;height:34px;border-radius:50%;background:rgba(14,21,38,.5);color:#fff;display:grid;place-items:center;backdrop-filter:blur(4px);transition:.15s}
.modal-x:hover{background:rgba(14,21,38,.75)}
.modal-x svg{width:16px;height:16px}

.detail-cover{position:relative;padding:26px 26px 22px;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));overflow:hidden}
.detail-cover::after{content:"";position:absolute;right:-70px;top:-90px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.12)}
.detail-cover::before{content:"";position:absolute;left:-50px;bottom:-110px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08)}
.dc-top{position:relative;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dc-brand{position:relative;font-size:11.5px;font-weight:800;letter-spacing:.06em;opacity:.92;margin-top:16px}
.detail-cover h2{position:relative;font-size:25px;font-weight:800;letter-spacing:-.035em;margin-top:3px;line-height:1.25}
.detail-cover .dc-campaign{position:relative;font-size:13.5px;font-weight:600;opacity:.92;margin-top:4px}
.dc-meta{position:relative;display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:11.5px;font-weight:700;opacity:.85}
.dc-meta span{display:inline-flex;align-items:center;gap:5px}
.dc-meta svg{width:13px;height:13px}
.dc-stats{position:relative;display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
.dc-stat{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:7px 11px;min-width:88px}
.dc-stat span{display:block;font-size:10px;font-weight:700;opacity:.8}
.dc-stat b{display:block;font-size:15px;font-weight:800;line-height:1.3}

.detail-body{padding:22px 26px 26px}
.dv-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,.9fr);gap:24px}
.block + .block{margin-top:24px}
.block-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}
.block h3{font-size:14px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:7px}
.block h3 .ico{width:22px;height:22px;border-radius:6px;background:var(--primary-050);color:var(--primary-700);display:grid;place-items:center;flex:0 0 auto}
.block h3 .ico svg{width:13px;height:13px}
.block .desc{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.65}
.provide-box{border:1px solid var(--line);border-radius:13px;padding:14px;background:#fbfcff}
.provide-box .pv{font-size:15px;font-weight:800;letter-spacing:-.02em}
.provide-box .pv-sub{font-size:11.5px;color:var(--muted-2);margin-top:3px}
.grade-table{margin-top:11px;border:1px solid var(--line);border-radius:11px;overflow:hidden}
.grade-table .gt-row{display:grid;grid-template-columns:74px 1fr auto;align-items:center;gap:8px;padding:9px 11px;font-size:12px;border-bottom:1px solid var(--line-2)}
.grade-table .gt-row:last-child{border-bottom:0}
.grade-table .gt-row.me{background:#f7f9ff}
.gt-grade{display:flex;align-items:center;gap:6px;font-weight:700}
.gt-benefit{color:#3f4b64;font-weight:600}
.gt-benefit strong{font-weight:800;color:var(--ink)}
.gt-mine{font-size:10px;font-weight:800;color:var(--primary-700);background:var(--primary-050);padding:2px 6px;border-radius:5px}

.visit-box{border:1px solid var(--line);border-radius:13px;padding:13px;background:#fff}
.visit-type-row{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800}
.visit-type-row .vt-badge{font-size:10.5px;padding:3px 7px;border-radius:6px;background:#eef1ff;color:var(--primary-700)}
.visit-type-row .vt-badge.free{background:var(--green-bg);color:var(--green)}
.visit-type-row + p{margin-top:5px;font-size:12px;color:var(--muted);line-height:1.6}
.slot-wrap{margin-top:12px}
.slot-head{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted-2);font-weight:700;margin-bottom:6px}
.slot-grid{display:flex;gap:3px;align-items:flex-end}
.slot{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.slot-bar{display:block;width:100%;height:26px;border-radius:5px;background:#e8f6ef;border:1px solid #d6efe3}
.slot.blocked .slot-bar{background:repeating-linear-gradient(135deg,#fdecec,#fdecec 4px,#f9dcdc 4px,#f9dcdc 8px);border-color:#f5d2d2}
.slot.closed .slot-bar{background:#f2f4f9;border-color:#e9ecf4}
.slot span{font-size:9px;color:#98a1b5;font-weight:700;white-space:nowrap}
.slot-legend{display:flex;gap:12px;margin-top:9px;font-size:10.5px;color:var(--muted);font-weight:600;flex-wrap:wrap}
.slot-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.slot-legend .lg-open{background:#e8f6ef;border:1px solid #d6efe3}
.slot-legend .lg-blocked{background:#f9dcdc;border:1px solid #f5d2d2}
.slot-legend .lg-closed{background:#f2f4f9;border:1px solid #e9ecf4}

.mission-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.mission-card{border:1px solid var(--line);border-radius:11px;padding:11px;background:#fff}
.mission-card .mc-top{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800}
.mission-card .mc-top svg{width:14px;height:14px}
.mission-card ul{margin-top:7px;display:flex;flex-direction:column;gap:4px}
.mission-card li{font-size:11.5px;color:var(--muted);display:flex;gap:6px;line-height:1.5}
.mission-card li::before{content:"";width:4px;height:4px;border-radius:50%;background:#c3cadb;margin-top:7px;flex:0 0 auto}
.kw-box{margin-top:10px;display:flex;flex-direction:column;gap:7px}
.kw-line{display:flex;gap:8px;align-items:flex-start;font-size:12px}
.kw-line .kl-label{flex:0 0 62px;font-size:10.5px;font-weight:800;color:var(--muted-2);padding-top:2px}
.kw-line .kl-val{display:flex;gap:4px;flex-wrap:wrap}
.kw-line .kl-val span{background:#f6f8fd;border:1px solid #eef1f9;padding:3px 7px;border-radius:6px;font-weight:700;font-size:11.5px;color:#3f4b64}
.kw-line .kl-val span.main{background:var(--primary-050);border-color:var(--primary-100);color:var(--primary-700)}
.fit-list{display:flex;flex-direction:column;gap:6px}
.fit-list li{display:flex;gap:7px;font-size:12.5px;color:#4a5670;line-height:1.55}
.fit-list li svg{width:14px;height:14px;color:var(--green);flex:0 0 auto;margin-top:2px}
.notes-list{display:flex;flex-direction:column;gap:5px}
.notes-list li{font-size:12px;color:var(--muted);display:flex;gap:7px;line-height:1.6}
.notes-list li::before{content:"·";font-weight:900;color:#b9c1d4}

.side-box{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}
.side-box + .side-box{margin-top:12px}
.side-box h4{font-size:12px;font-weight:800;color:#3f4b64;display:flex;align-items:center;gap:6px}
.side-box h4 svg{width:14px;height:14px;color:var(--muted-2)}
.side-kpi{display:flex;align-items:baseline;justify-content:space-between;margin-top:10px;font-size:12px;color:var(--muted)}
.side-kpi b{font-size:18px;color:var(--ink);font-weight:800}
.progress-lg{height:9px;border-radius:99px;background:#eef1f8;overflow:hidden;margin-top:9px}
.progress-lg i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#2f4bff,#7a5cff)}
.branch-list{display:flex;flex-direction:column;gap:6px;margin-top:9px}
.branch-opt{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;background:#fff;transition:.14s}
.branch-opt:hover{border-color:#c9d3f0}
.branch-opt.on{border-color:var(--primary);background:#f7f9ff;box-shadow:0 0 0 3px rgba(47,75,255,.08)}
.branch-opt .bo-l{display:flex;flex-direction:column;gap:1px}
.branch-opt small{font-size:10.5px;color:var(--muted-2);font-weight:600}
.branch-opt .bo-n{font-size:10.5px;color:var(--muted-2);font-weight:700}
.modal-foot{position:sticky;bottom:0;z-index:5;display:flex;align-items:center;gap:12px;padding:13px 22px;border-top:1px solid var(--line);background:rgba(255,255,255,.97);backdrop-filter:blur(8px);box-shadow:0 -10px 24px -20px rgba(20,30,70,.55)}
.mf-meta{min-width:0;flex:1}
.mf-meta span{display:block;font-size:10.5px;color:var(--muted-2);font-weight:700}
.mf-meta b{display:block;font-size:13.5px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modal-foot .btn{flex:0 0 auto}

/* ============================ apply form =============================== */
.form-cover{padding:22px 24px 18px;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;position:relative;overflow:hidden}
.form-cover::after{content:"";position:absolute;right:-60px;top:-70px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.12)}
.form-cover .fc-store{position:relative;font-size:12px;font-weight:700;opacity:.9}
.form-cover h2{position:relative;font-size:20px;font-weight:800;margin-top:2px;letter-spacing:-.03em}
.form-cover p{position:relative;font-size:11.5px;opacity:.85;margin-top:4px}
.apply-body{padding:20px 24px 24px;display:flex;flex-direction:column;gap:20px}
.fs-head{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.fs-n{width:20px;height:20px;border-radius:6px;background:var(--ink);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;flex:0 0 auto}
.fs-head h4{font-size:13px;font-weight:800}
.fs-head .fs-req{font-size:10px;font-weight:800;color:#c33}
.fs-head .fs-hint{font-size:11px;color:var(--muted-2);font-weight:600;margin-left:auto}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field > label{font-size:11.5px;font-weight:800;color:#3f4b64;display:flex;align-items:center;gap:4px}
.field > label .req{color:#c33;font-size:11px}
.field .input,.field select,.field textarea{width:100%;height:42px;border-radius:10px;border:1px solid var(--line);background:#fcfdff;padding:0 11px;font-size:13px;transition:.14s}
.field textarea{height:auto;min-height:96px;padding:10px 11px;line-height:1.65;resize:vertical}
.field .input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:#b9c6f2;background:#fff;box-shadow:0 0 0 3px rgba(47,75,255,.09)}
.field .input[aria-invalid="true"]{border-color:#e39b9b;background:#fffafa}
.field .hint{font-size:10.5px;color:var(--muted-2);line-height:1.5}
.field .err{font-size:10.5px;color:#c33;font-weight:700;min-height:0}
.media-pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px}
.media-pick label{position:relative;display:flex;flex-direction:column;gap:3px;padding:11px 10px;border:1px solid var(--line);border-radius:11px;cursor:pointer;transition:.14s;background:#fff}
.media-pick input{position:absolute;opacity:0}
.media-pick label:hover{border-color:#c9d3f0}
.media-pick label:has(input:checked){border-color:var(--primary);background:#f7f9ff;box-shadow:0 0 0 3px rgba(47,75,255,.08)}
.media-pick .mp-top{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:800}
.media-pick .mp-top svg{width:14px;height:14px}
.media-pick small{font-size:10px;color:var(--muted-2);font-weight:600;line-height:1.4}
.seg{display:inline-flex;background:#f4f6fc;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;width:100%}
.seg label{flex:1;text-align:center;padding:7px 6px;border-radius:7px;font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer}
.seg input{position:absolute;opacity:0}
.seg label:has(input:checked){background:#fff;color:var(--ink);box-shadow:var(--shadow-xs)}
.consent{border:1px solid var(--line);border-radius:12px;padding:12px 13px;background:#fbfcff}
.consent summary{font-size:12px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:6px}
.consent .consent-body{margin-top:8px;font-size:11.5px;color:var(--muted);line-height:1.7}
.consent .consent-body b{color:#3f4b64}
.check{display:flex;align-items:flex-start;gap:8px;font-size:12px;font-weight:700;cursor:pointer;margin-top:11px}
.check input{width:16px;height:16px;margin-top:2px;accent-color:var(--primary);flex:0 0 auto}
.form-error{display:none;align-items:flex-start;gap:8px;padding:11px 12px;border-radius:10px;background:#fdeeee;border:1px solid #f6d7d7;font-size:12px;font-weight:700;color:#b42c2c}
.form-error.on{display:flex}
.form-error svg{width:15px;height:15px;flex:0 0 auto;margin-top:1px}
.form-actions{display:flex;gap:9px;align-items:center}
.form-actions .btn{flex:1}
.honeypot{position:absolute;left:-9999px;opacity:0;height:0;overflow:hidden}
.done-screen{padding:34px 24px 30px;text-align:center}
.done-badge{width:64px;height:64px;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#e9f9f2,#d5f3e6);color:var(--green);box-shadow:0 0 0 8px rgba(11,155,107,.07)}
.done-badge svg{width:30px;height:30px}
.done-screen h2{margin-top:16px;font-size:21px;font-weight:800;letter-spacing:-.03em}
.done-screen .sub{margin-top:7px;font-size:12.5px;color:var(--muted);line-height:1.7}
.receipt{display:inline-flex;align-items:center;gap:8px;margin-top:13px;padding:8px 13px;border-radius:999px;background:#f5f7fc;border:1px dashed #d6ddec;font-size:12px;font-weight:700;color:#4a5568}
.receipt b{font-family:ui-monospace,Menlo,monospace;color:var(--ink)}
.done-summary{margin-top:16px;text-align:left;background:#fafbfe;border:1px solid var(--line-2);border-radius:12px;padding:4px 14px}
.done-summary div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:12px}
.done-summary div:last-child{border-bottom:0}
.done-summary dt{color:var(--muted-2);font-weight:700}
.done-summary dd{margin:0;font-weight:700;text-align:right;min-width:0;overflow-wrap:anywhere}
.done-note{margin-top:12px;font-size:11px;color:var(--muted-2);line-height:1.65}

/* ============================ my page ================================= */
.my-hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1.85fr);gap:14px;margin-top:18px}
.my-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px}
.my-identity{position:relative;overflow:hidden;background:linear-gradient(140deg,#131a2b,#2c3752);color:#fff}
.my-identity::after{content:"";position:absolute;right:-60px;top:-80px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08)}
.mi-top{display:flex;align-items:center;gap:13px;position:relative}
.mi-avatar{width:54px;height:54px;border-radius:18px;background:linear-gradient(135deg,#e2384f,#ff8a5c);display:grid;place-items:center;font-size:20px;font-weight:800;color:#fff;flex:0 0 auto;box-shadow:0 8px 18px -10px rgba(0,0,0,.6)}
.mi-name{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.mi-name h2{font-size:19px;font-weight:800;letter-spacing:-.03em}
.mi-handle{font-size:11.5px;opacity:.66;font-weight:600;margin-top:1px}
.mi-tag{font-size:11px;opacity:.8;margin-top:4px;font-weight:600}
.mi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;position:relative}
.mi-stat{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12);border-radius:11px;padding:9px 10px}
.mi-stat span{display:block;font-size:10px;opacity:.7;font-weight:700}
.mi-stat b{display:block;font-size:16px;font-weight:800;margin-top:1px}
.mi-meter{margin-top:14px;position:relative}
.mi-meter .mm-label{display:flex;justify-content:space-between;font-size:10.5px;font-weight:700;opacity:.8;margin-bottom:5px}
.mi-meter .bar{height:7px;border-radius:99px;background:rgba(0,0,0,.3);overflow:hidden}
.mi-meter .bar i{display:block;height:100%;border-radius:99px;background:#fff}
.my-right{display:flex;flex-direction:column;gap:12px}
.perk-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.perk{display:flex;align-items:center;gap:8px;padding:9px 11px;border:1px solid var(--line-2);border-radius:10px;background:#fbfcff;font-size:11.5px;font-weight:700;color:#3f4b64}
.perk svg{width:14px;height:14px;color:var(--primary);flex:0 0 auto}
.gc-link .i,.tiny .i{flex:0 0 auto}
.grade-ladder{display:flex;gap:5px;margin-top:6px}
.gl-step{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:6px;position:relative}
.gl-step::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;border-radius:99px;background:#eef1f8}
.gl-step.on::before{background:linear-gradient(90deg,#2f4bff,#7a5cff)}
.gl-step span{font-size:10px;font-weight:800;color:var(--muted-2)}
.gl-step.on span{color:var(--ink)}
.my-tabs{display:flex;gap:5px;margin:20px 0 14px;border-bottom:1px solid var(--line);padding-bottom:0;overflow-x:auto}
.my-tabs button{position:relative;padding:10px 14px;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.my-tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.my-tabs .cnt{font-size:10.5px;font-weight:800;color:var(--primary-700);background:var(--primary-050);padding:1px 6px;border-radius:99px;margin-left:4px}

.app-list{display:flex;flex-direction:column;gap:10px}
.app-row{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px 17px;display:flex;gap:16px;align-items:center;transition:.14s}
.app-row:hover{border-color:#d9e0f2;box-shadow:var(--shadow-sm)}
.ar-main{flex:1;min-width:0}
.ar-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ar-store{font-size:12px;font-weight:800;color:#3f4b64}
.ar-top .tag{height:19px;font-size:10px}
.ar-main h4{font-size:14.5px;font-weight:800;margin-top:4px;letter-spacing:-.02em}
.ar-meta{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted-2);font-weight:600;margin-top:4px}
.ar-meta b{color:#4a5670;font-weight:700}
.stepper{display:flex;align-items:center;gap:0;margin-top:11px;flex-wrap:wrap}
.stp{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:700;color:#a3abbe}
.stp i{width:15px;height:15px;border-radius:50%;border:1.5px solid #dfe4f0;display:grid;place-items:center;font-size:8px;font-style:normal;background:#fff}
.stp.done{color:var(--green)}
.stp.done i{background:var(--green);border-color:var(--green);color:#fff}
.stp.now{color:var(--primary-700)}
.stp.now i{border-color:var(--primary);background:var(--primary-050);color:var(--primary-700);font-weight:900}
.stp-line{width:14px;height:1.5px;background:#e4e8f2;margin:0 4px}
.stp-line.done{background:var(--green)}
.ar-side{display:flex;flex-direction:column;align-items:flex-end;gap:7px;flex:0 0 auto}
.ar-side .btn{min-width:104px}
.empty-box{padding:40px 20px;text-align:center;border:1px dashed #d9dfee;border-radius:16px;background:#fbfcff;color:var(--muted)}
.empty-box b{display:block;font-size:14px;color:var(--ink);margin-bottom:5px}
.empty-box p{font-size:12px;line-height:1.6}

/* review submission */
.review-layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(330px,.85fr);gap:16px;align-items:start}
.review-form{background:#fff;border:1px solid var(--line);border-radius:18px;padding:19px}
.rf-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.rf-head h3{font-size:15px;font-weight:800}
.rf-head .target{font-size:11.5px;color:var(--muted);font-weight:600}
.rf-tools{display:flex;gap:5px}
.inspect{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;position:sticky;top:calc(var(--topbar-h) + 14px)}
.inspect-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.inspect-head h3{font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px}
.inspect-head h3 svg{width:15px;height:15px;color:var(--primary)}
.inspect-head .auto{font-size:10px;font-weight:800;color:var(--primary-700);background:var(--primary-050);padding:3px 7px;border-radius:6px}
.score-row{display:flex;align-items:center;gap:14px;margin-top:14px}
.gauge{--p:0;width:84px;height:84px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;position:relative;background:conic-gradient(var(--gc) calc(var(--p)*1%),#eef1f8 0)}
.gauge::before{content:"";position:absolute;inset:7px;border-radius:50%;background:#fff}
.gauge .gv{position:relative;text-align:center;line-height:1}
.gauge .gv b{font-size:24px;font-weight:800;letter-spacing:-.03em}
.gauge .gv span{display:block;font-size:9.5px;color:var(--muted-2);font-weight:700;margin-top:2px}
.score-meta{min-width:0}
.score-meta .sm-status{font-size:12.5px;font-weight:800}
.score-meta .sm-desc{font-size:11px;color:var(--muted);line-height:1.55;margin-top:3px}
.ck-list{display:flex;flex-direction:column;gap:6px;margin-top:14px;max-height:none}
.ck{display:flex;align-items:flex-start;gap:8px;padding:8px 9px;border:1px solid var(--line-2);border-radius:9px;background:#fcfdff}
.ck .ck-ico{width:17px;height:17px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;margin-top:1px;font-size:9px;font-weight:900;color:#fff}
.ck.pass .ck-ico{background:var(--green)}
.ck.warn .ck-ico{background:#e6a700}
.ck.fail .ck-ico{background:var(--red)}
.ck .ck-body{min-width:0;flex:1}
.ck .ck-body b{display:block;font-size:11.5px;font-weight:800;color:#3f4b64}
.ck .ck-body span{display:block;font-size:10.5px;color:var(--muted);line-height:1.5;margin-top:1px}
.ck .ck-st{font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:5px;flex:0 0 auto}
.ck.pass .ck-st{background:var(--green-bg);color:var(--green)}
.ck.warn .ck-st{background:var(--amber-bg);color:var(--amber)}
.ck.fail .ck-st{background:var(--red-bg);color:var(--red)}
.inspect-note{margin-top:13px;border-top:1px dashed var(--line);padding-top:12px}
.inspect-note h4{font-size:11px;font-weight:800;color:#3f4b64;display:flex;align-items:center;justify-content:space-between}
.inspect-note pre{margin:7px 0 0;white-space:pre-wrap;font-family:var(--font);font-size:10.5px;line-height:1.65;color:#4a5670;background:#f8fafd;border:1px solid var(--line-2);border-radius:8px;padding:9px 10px;max-height:150px;overflow:auto}
.checklist{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.cl-item{display:flex;align-items:center;gap:7px;padding:8px 9px;border:1px solid var(--line);border-radius:9px;font-size:11.5px;font-weight:700;cursor:pointer;background:#fff}
.cl-item:has(input:checked){border-color:var(--primary-100);background:var(--primary-050)}
.cl-item input{width:15px;height:15px;accent-color:var(--primary)}
.cl-item .cl-num{width:42px;height:26px;border:1px solid var(--line);border-radius:6px;text-align:center;font-size:11.5px;padding:0 4px}
.char-count{font-size:10.5px;color:var(--muted-2);font-weight:700;text-align:right;margin-top:3px}
.form-tip{display:flex;gap:6px;font-size:10.5px;color:var(--muted);background:#f8fafd;border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;line-height:1.55}
.form-tip svg{width:13px;height:13px;color:var(--primary);flex:0 0 auto;margin-top:1px}

.manner-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.manner-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
.manner-card h3{font-size:13.5px;font-weight:800;display:flex;align-items:center;gap:6px}
.manner-score-lg{display:flex;align-items:baseline;gap:5px;margin-top:9px}
.manner-score-lg b{font-size:32px;font-weight:800;letter-spacing:-.04em}
.manner-score-lg span{font-size:12px;color:var(--muted-2);font-weight:700}
.stars{display:inline-flex;gap:1px;color:#f0b429}
.stars svg{width:13px;height:13px}
.manner-item{padding:10px 0;border-top:1px solid var(--line-2);font-size:12px}
.manner-item .mi-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.manner-item .mi-top b{font-size:12px;font-weight:800}
.manner-item .mi-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.manner-item .mi-comment{color:var(--muted);font-size:11.5px;line-height:1.6;margin-top:5px}
.notice-box{display:flex;gap:9px;padding:12px 14px;border-radius:12px;background:var(--amber-bg);border:1px solid #f7e3bd;font-size:11.5px;color:#7d5400;line-height:1.6}
.notice-box svg{width:15px;height:15px;flex:0 0 auto;margin-top:1px}

/* ============================ admin =================================== */
.admin-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:22px}
.admin-head h1{font-size:24px;font-weight:800;letter-spacing:-.035em}
.admin-head p{font-size:12.5px;color:var(--muted);margin-top:4px}
.admin-actions{display:flex;gap:6px;flex-wrap:wrap}
.kpi-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;position:relative;overflow:hidden}
.kpi span{display:block;font-size:10.5px;font-weight:700;color:var(--muted-2)}
.kpi b{display:block;font-size:22px;font-weight:800;letter-spacing:-.035em;margin-top:4px;line-height:1.15}
.kpi b em{font-size:11px;font-style:normal;font-weight:700;color:var(--muted-2);margin-left:2px}
.kpi .delta{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:800;margin-top:4px}
.kpi .delta.up{color:var(--green)}
.kpi .delta.down{color:var(--red)}
.kpi .delta svg{width:11px;height:11px}
.kpi .spark{position:absolute;right:10px;bottom:8px;width:54px;height:22px;opacity:.85}
.admin-tabs{display:flex;gap:2px;margin:18px 0 14px;background:#eef1f8;border:1px solid var(--line);padding:4px;border-radius:12px;overflow-x:auto}
.admin-tabs button{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.admin-tabs button svg{width:14px;height:14px}
.admin-tabs button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow-xs)}
.admin-tabs .cnt{font-size:10px;font-weight:800;background:var(--primary-050);color:var(--primary-700);padding:1px 5px;border-radius:99px}

.panel{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-head h3{font-size:13.5px;font-weight:800;display:flex;align-items:center;gap:7px}
.panel-head h3 svg{width:15px;height:15px;color:var(--muted-2)}
.panel-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.panel-tools .sel select{max-width:230px}
.panel-body{padding:0}
.table-wrap{overflow-x:auto}
.tbl{font-size:12px;min-width:820px}
.tbl th{position:sticky;top:0;background:#fafbfe;text-align:left;font-size:10.5px;font-weight:800;color:var(--muted-2);padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap;letter-spacing:.02em;z-index:2}
.tbl td{padding:10px 11px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background .12s}
.tbl tbody tr:hover{background:#fbfcff}
.tbl tbody tr.picked{background:#f6f8ff}
.tbl tbody tr.branch-row:hover{background:transparent}
.tbl .chk-cell{width:34px}
.tbl .chk-cell input{width:15px;height:15px;accent-color:var(--primary)}
.tbl .who{display:flex;align-items:center;gap:8px;min-width:0}
.tbl .who .avatar{width:26px;height:26px;font-size:10.5px;border-radius:8px}
.tbl .who .wn{min-width:0}
.tbl .who b{display:block;font-size:12px;font-weight:800;white-space:nowrap}
.tbl .who span{display:block;font-size:10px;color:var(--muted-2);font-weight:600;white-space:nowrap}
.tbl .cell-strong{font-weight:700;color:#3f4b64}
.tbl .cell-sub{font-size:10px;color:var(--muted-2);font-weight:600;margin-top:1px}
.tbl .row-actions{display:flex;gap:4px;justify-content:flex-end}
.mini-sel{height:28px;border:1px solid var(--line);border-radius:7px;font-size:11px;font-weight:700;padding:0 6px;background:#fff;color:#3f4b64}
.bulkbar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(120%);z-index:80;display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;padding:10px 12px 10px 16px;border-radius:14px;box-shadow:var(--shadow-lg);transition:transform .22s;max-width:calc(100vw - 24px);flex-wrap:wrap}
.bulkbar.on{transform:translateX(-50%)}
.bulkbar b{font-size:12.5px;font-weight:800;white-space:nowrap}
.bulkbar .bb-actions{display:flex;gap:5px;flex-wrap:wrap}
.bulkbar .btn{height:32px;font-size:11.5px;padding:0 11px;border-radius:8px;border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff}
.bulkbar .btn:hover{background:rgba(255,255,255,.2)}
.bulkbar .btn.w{background:#fff;color:var(--ink);border-color:#fff}
.bulkbar .close{color:#9aa5be}

/* ============================ 자동 매칭 점수 ========================== */
.tbl-match{min-width:960px}
.match-pill{display:inline-flex;align-items:center;gap:4px;height:25px;padding:0 7px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:800;transition:.14s;white-space:nowrap}
.match-pill:hover{border-color:#c7d0e6;box-shadow:var(--shadow-xs)}
.match-pill:focus-visible{outline:3px solid rgba(47,75,255,.4);outline-offset:2px}
.match-pill b{font-size:12.5px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.match-pill .mu{font-size:9px;font-weight:700;color:var(--muted-2)}
.match-pill .mg{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:5px;font-size:9.5px;font-style:normal;font-weight:900;color:#fff;margin-left:1px}
.match-pill.a{background:var(--green-bg);border-color:#c9ecdc}
.match-pill.a b{color:var(--green)}
.match-pill.a .mg{background:var(--green)}
.match-pill.b{background:var(--amber-bg);border-color:#f5e2bd}
.match-pill.b b{color:var(--amber)}
.match-pill.b .mg{background:#c98a12}
.match-pill.c{background:#f4f5f8;border-color:#e4e7ef}
.match-pill.c b{color:#6d7789}
.match-pill.c .mg{background:#8a93a7}
.match-cell{display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.match-why,.mh-why{display:flex;flex-wrap:wrap;align-items:center;gap:2px 4px}
.match-why{max-width:235px;font-size:10px;line-height:1.45;color:var(--muted-2);font-weight:600}
.match-why .mw,.mh-why .mw{white-space:nowrap}
.match-why .mw.neg,.mh-why .mw.neg{color:#b4452f;font-weight:800}
.match-why .sep,.mh-why .sep{color:#c8cfdd}
.match-why .mw-muted{color:#a8b0c0}
.fr-label{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;color:var(--muted-2);letter-spacing:.02em;margin-right:2px}
.fr-label svg{width:13px;height:13px}
.chip.sm{height:28px;font-size:11.5px;padding:0 10px;border-radius:8px}
.match-sum{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.match-sum b{color:var(--ink);font-weight:800}
.match-sum .sep{color:#d3d9e6}

.md-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.md-head h2{display:flex;align-items:center;gap:6px}
.match-hero{display:flex;align-items:center;gap:13px;padding:12px 14px;border-radius:13px;border:1px solid var(--line);background:#fbfcff}
.match-hero.a{background:linear-gradient(135deg,#eafaf2,#f8fffb);border-color:#cfeee0}
.match-hero.b{background:linear-gradient(135deg,#fff7e8,#fffdf7);border-color:#f5e3c0}
.match-hero.c{background:linear-gradient(135deg,#f5f6fa,#fbfcfe);border-color:#e5e8f0}
.mh-score{display:flex;align-items:baseline;gap:1px;flex:0 0 auto}
.mh-score b{font-size:30px;font-weight:900;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums;color:#3f4b64}
.match-hero.a .mh-score b{color:var(--green)}
.match-hero.b .mh-score b{color:var(--amber)}
.match-hero.c .mh-score b{color:#6d7789}
.mh-score span{font-size:11px;font-weight:800;color:var(--muted-2)}
.mh-meta{min-width:0;flex:1}
.mh-grade{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:800}
.mh-grade span{font-size:10.5px;font-weight:700;color:var(--muted)}
.grade-seal{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:6px;font-size:11px;font-style:normal;font-weight:900;color:#fff}
.grade-seal.a{background:var(--green)}
.grade-seal.b{background:#c98a12}
.grade-seal.c{background:#8a93a7}
.mh-why{margin-top:4px;font-size:10.5px;font-weight:700;color:var(--muted)}
.match-bars{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.mb-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.mb-label{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;color:var(--ink)}
.mb-label svg{width:13px;height:13px;color:var(--muted-2)}
.mb-label em{font-style:normal;font-size:9.5px;font-weight:600;color:var(--muted-2)}
.mb-score{font-size:11.5px;font-weight:900;font-variant-numeric:tabular-nums;color:#3f4b64;white-space:nowrap}
.mb-score i{font-style:normal;font-size:9.5px;font-weight:700;color:var(--muted-2)}
.mb-track{height:6px;border-radius:99px;background:#eef1f8;margin-top:4px;overflow:hidden}
.mb-fill{display:block;height:100%;border-radius:99px;background:var(--primary)}
.mb-fill.a{background:linear-gradient(90deg,#0b9b6b,#48d3a4)}
.mb-fill.b{background:linear-gradient(90deg,#d79a17,#f3c661)}
.mb-fill.c{background:linear-gradient(90deg,#8a93a7,#b6becd)}
.mb-items{display:flex;flex-direction:column;gap:2px;margin-top:5px}
.mb-item{font-size:10.5px;font-weight:700;color:var(--muted);line-height:1.5}
.mb-item b{color:#3f4b64;font-weight:900;font-variant-numeric:tabular-nums}
.mb-item i{font-style:normal;font-weight:700;color:var(--muted-2)}
.mb-item span{color:var(--muted-2)}
.mb-item.minus b{color:#b4452f}

.split{display:grid;grid-template-columns:minmax(300px,.85fr) minmax(0,1.35fr);gap:14px;align-items:start}
.list-pane{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;max-height:640px;overflow-y:auto}
.lp-item{padding:12px 14px;border-bottom:1px solid var(--line-2);cursor:pointer;transition:.12s}
.lp-item:last-child{border-bottom:0}
.lp-item:hover{background:#fbfcff}
.lp-item.on{background:#f6f8ff;box-shadow:inset 3px 0 0 var(--primary)}
.lp-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lp-top b{font-size:12.5px;font-weight:800}
.lp-sub{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.5}
.lp-meta{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.score-badge{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:6px}
.score-badge.hi{background:var(--green-bg);color:var(--green)}
.score-badge.mid{background:var(--amber-bg);color:var(--amber)}
.score-badge.lo{background:var(--red-bg);color:var(--red)}
.detail-pane{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
.dp-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.dp-head h3{font-size:15px;font-weight:800;letter-spacing:-.02em}
.dp-head .sub{font-size:11.5px;color:var(--muted);margin-top:3px}
.dp-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,.72fr);gap:14px;margin-top:14px;align-items:start}
.post-view{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fcfdff}
.post-view .pv-title{font-size:13.5px;font-weight:800;line-height:1.45}
.post-view .pv-url{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--primary-700);font-weight:700;margin-top:4px;overflow-wrap:anywhere}
.post-view .pv-url svg{width:11px;height:11px;flex:0 0 auto}
.post-view .pv-body{margin-top:10px;white-space:pre-wrap;font-size:12px;line-height:1.75;color:#3f4b64}
.post-view mark{background:#fff3c4;color:inherit;padding:0 1px;border-radius:3px}
.hl-kw{background:#e8edff;border-radius:3px;padding:0 2px}
.hl-bad{background:#ffe3e3;border-radius:3px;padding:0 2px}
.hl-ok{background:#dcf5e9;border-radius:3px;padding:0 2px}
.dp-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line-2)}
.dp-note{margin-top:10px}
.dp-note textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:11.5px;line-height:1.6;background:#fcfdff;resize:vertical}
.dp-note textarea:focus{outline:none;border-color:#b9c6f2;box-shadow:0 0 0 3px rgba(47,75,255,.08)}

.report-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;align-items:start}
.report-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
.report-card h3{font-size:13.5px;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:8px}
.report-card h3 .rc-sub{font-size:10.5px;color:var(--muted-2);font-weight:700}
.rank-table{margin-top:11px;font-size:11.5px}
.rank-table th{font-size:10px;color:var(--muted-2);font-weight:800;text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
.rank-table td{padding:8px 6px;border-bottom:1px solid var(--line-2)}
.rank-table tr:last-child td{border-bottom:0}
.rank-no{font-weight:800;font-size:13px}
.rank-no.top{color:var(--primary-700)}
.rank-delta{display:inline-flex;align-items:center;gap:2px;font-size:10.5px;font-weight:800}
.rank-delta.up{color:var(--green)}
.rank-delta.down{color:var(--red)}
.rank-delta.flat{color:var(--muted-2)}
.rank-delta svg{width:10px;height:10px}
.chart-box{margin-top:10px}
.chart-legend{display:flex;gap:10px;font-size:10px;font-weight:700;color:var(--muted-2);flex-wrap:wrap}
.chart-legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:3px}
.stat-tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}
.stat-tile{background:#fafbfe;border:1px solid var(--line-2);border-radius:10px;padding:9px 10px}
.stat-tile span{display:block;font-size:10px;color:var(--muted-2);font-weight:700}
.stat-tile b{display:block;font-size:17px;font-weight:800;letter-spacing:-.03em;margin-top:1px}
.stat-tile em{font-style:normal;font-size:10px;font-weight:800;margin-left:4px}
.stat-tile em.up{color:var(--green)}
.stat-tile em.down{color:var(--red)}
.store-pills{display:flex;gap:5px;flex-wrap:wrap;margin-top:11px}

.pool-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
.pool-card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;transition:.14s}
.pool-card:hover{border-color:#d9e0f2;box-shadow:var(--shadow-sm)}
.pc-top{display:flex;align-items:center;gap:9px}
.pc-top .avatar{width:36px;height:36px;border-radius:11px;font-size:13px}
.pc-id{min-width:0;flex:1}
.pc-id b{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:800}
.pc-id span{display:block;font-size:10.5px;color:var(--muted-2);font-weight:600}
.pc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:11px;padding-top:10px;border-top:1px solid var(--line-2)}
.pc-stats div span{display:block;font-size:9.5px;color:var(--muted-2);font-weight:700}
.pc-stats div b{display:block;font-size:12.5px;font-weight:800}
.pc-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:9px}
.pc-actions{display:flex;gap:5px;margin-top:11px}
.pc-actions .btn{flex:1}
.branch-editor{border-top:1px solid var(--line-2);padding:11px 15px;background:#fbfcff}
.be-row{display:flex;align-items:center;gap:8px;font-size:11.5px;padding:5px 0}
.be-row b{font-weight:800;min-width:96px}
.be-row .be-cap{display:inline-flex;align-items:center;gap:4px;margin-left:auto}
.be-cap button{width:22px;height:22px;border-radius:6px;border:1px solid var(--line);background:#fff;font-weight:800;font-size:12px;display:grid;place-items:center}
.be-cap span{min-width:44px;text-align:center;font-weight:800}

/* ============================ settings / toast ========================= */
.settings-body{padding:22px 24px 26px}
.settings-body h2{font-size:19px;font-weight:800;letter-spacing:-.03em}
.settings-body .sub{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.6}
.settings-sec{margin-top:16px;padding-top:15px;border-top:1px solid var(--line-2)}
.settings-sec h3{font-size:12.5px;font-weight:800;display:flex;align-items:center;gap:6px}
.map-table{margin-top:8px;font-size:11px;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.map-table div{display:grid;grid-template-columns:1.1fr 1fr;gap:8px;padding:6px 9px;border-bottom:1px solid var(--line-2)}
.map-table div:last-child{border-bottom:0}
.map-table b{font-weight:800;color:#3f4b64}
.map-table span{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(30px);z-index:200;background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:12.5px;font-weight:700;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:.22s;max-width:calc(100vw - 32px);display:flex;align-items:center;gap:8px}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast svg{width:15px;height:15px;color:#5ee0a8;flex:0 0 auto}
.toast.err svg{color:#ff9a9a}

}

  .inspect{position:static}

}

  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;border-radius:10px;font-size:10px;font-weight:700;color:var(--muted-2)}

  .ex-hero{padding:24px 18px 22px;border-radius:20px}
  .ex-copy h1{font-size:26px}
  .viewer-meta{display:none}
  .viewer-btn{width:40px;height:40px;padding:0;justify-content:center}

  .sync-pill{display:none}
  .cards-grid{grid-template-columns:1fr;gap:12px}
  .shelf{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi-row{grid-template-columns:repeat(2,minmax(0,1fr))}
  .modal-dialog{width:100vw;max-height:94vh;margin:6vh 0 0;border-radius:20px 20px 0 0}

  .modal.open{display:flex;align-items:flex-end}
  .modal-backdrop{position:fixed}
  .detail-cover{padding:20px 18px 18px}
  .detail-cover h2{font-size:21px}
  .detail-body{padding:18px}
  .modal-foot{padding:11px 14px calc(11px + env(safe-area-inset-bottom))}
  .apply-body{padding:16px 18px 24px}
  .form-grid{grid-template-columns:1fr}
  .media-pick{grid-template-columns:repeat(2,minmax(0,1fr))}
  .review-form,.inspect{padding:14px}
  .checklist{grid-template-columns:1fr}
  .my-card{padding:16px}
  .app-row{flex-direction:column;align-items:stretch;gap:10px}
  .ar-side{flex-direction:row;align-items:center;justify-content:space-between}
  .ar-side .btn{min-width:0;flex:1}
  .my-tabs button{padding:9px 11px;font-size:12px}
  .admin-head{margin-top:16px}
  .admin-head h1{font-size:20px}
  .pool-grid{grid-template-columns:1fr}
  .filter-row{gap:6px}
  .search{flex:1 1 100%}
  .filter-count{order:9}
  .bulkbar{left:8px;right:8px;bottom:76px;transform:translateY(140%);max-width:none}
  .bulkbar.on{transform:none}
  .steps-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  .faq-grid{grid-template-columns:1fr!important}
}
@media (max-width:720px){
  /* 표 → 카드형 스택 */
  .tbl{display:block;min-width:0}
  .tbl thead{display:none}
  .tbl tbody{display:block}
  .tbl tr{display:block;margin:10px;padding:4px 2px;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:var(--shadow-xs)}
  .tbl tbody tr:hover{background:#fff}
  .tbl td{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;padding:6px 11px;border:0;text-align:right}

  .tbl td[data-label="매너"],.tbl td[data-label="접수일"]{display:none}
  .tbl td::before{content:attr(data-label);flex:0 0 auto;font-size:10px;font-weight:800;color:var(--muted-2);text-align:left}
  .tbl td[data-label=""]{justify-content:flex-start;padding-top:9px;padding-bottom:7px;border-bottom:1px dashed var(--line-2)}
  .tbl td[data-label=""]::before{display:none}
  .tbl td.chk-cell{display:none}
  .tbl td .row-actions{justify-content:flex-end;flex-wrap:wrap}
  .tbl tr.branch-row{margin:0 10px 10px;border-top:0;border-radius:0 0 12px 12px}
  .tbl tr.branch-row td{display:block;text-align:left;padding:0}
  .table-wrap{overflow:visible}
  .tbl td[data-label="매칭"]{flex-wrap:wrap;gap:3px 8px}
  .tbl td[data-label="매칭"] .match-cell{flex:1 1 auto;align-items:flex-end}
  .tbl td[data-label="매칭"] .match-why{max-width:none;justify-content:flex-end;text-align:right;flex-basis:100%}
  .match-sum{order:9;margin-left:0;width:100%;justify-content:flex-end}
  .match-hero{gap:10px;padding:11px 12px}
  .mh-score b{font-size:26px}
  .be-row{flex-wrap:wrap}
  .be-row .be-cap{margin-left:auto}
}
@media (max-width:560px){
  .topbar-inner{height:60px}

  .dc-stat b{font-size:14px;line-height:1.35}
  .toast{bottom:86px}
  .rf-head{align-items:flex-start;gap:8px;flex-wrap:wrap}
  .rf-tools{width:100%}

  .brand-text span{display:none}
  .brand-text strong{font-size:14px}
  .ex-hero{margin-top:12px}
  .ex-copy h1{font-size:23px}
  .hero-actions .btn{flex:1;height:42px;font-size:13px}
  .shelf{grid-template-columns:1fr 1fr}
  .dc-stats .dc-stat{flex:1;min-width:0}
  .mission-grid{grid-template-columns:1fr}
  .score-row{gap:10px}
  .gauge{width:72px;height:72px}
  .gauge .gv b{font-size:21px}
  .kpi-row{grid-template-columns:1fr 1fr}
  .my-stats{grid-template-columns:1fr 1fr}
  .perk-grid{grid-template-columns:1fr}
  .stat-tiles{grid-template-columns:1fr 1fr}
  .filter-shell{padding:9px}
  .toggle{height:30px;font-size:11.5px}
  .chip{height:30px;font-size:11.5px;padding:0 10px}
  .admin-tabs{flex-wrap:wrap;gap:3px}
  .admin-tabs button{font-size:11.5px;padding:7px 10px;flex:1 1 auto;justify-content:center}
  .panel-head{padding:11px 12px}
  .tbl th,.tbl td{padding:8px 9px}
}
@media print{
  .topbar,.tabbar,.filter-shell,.admin-tabs,.admin-actions,.bulkbar,.modal-x,.btn,.panel-tools{display:none!important}
  body{background:#fff}
  .main{padding:0;max-width:none}
  .kpi,.panel,.report-card{break-inside:avoid;box-shadow:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}

var U = {
  esc: function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  },
  pad: function (n) { return (n < 10 ? '0' : '') + n; },
  today: function () { var d = new Date(); d.setHours(0, 0, 0, 0); return d; },
  addDays: function (base, n) { var d = new Date(base.getTime()); d.setDate(d.getDate() + n); return d; },
  daysFromNow: function (n) { return U.addDays(U.today(), n); },
  iso: function (d) { return d.getFullYear() + '-' + U.pad(d.getMonth() + 1) + '-' + U.pad(d.getDate()); },
  parseISO: function (s) {
    if (s instanceof Date) return s;
    var m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (!m) return null;
    return new Date(+m[1], +m[2] - 1, +m[3]);
  },
  WD: ['일', '월', '화', '수', '목', '금', '토'],
  fmtMD: function (s) {
    var d = U.parseISO(s); if (!d) return '-';
    return (d.getMonth() + 1) + '/' + d.getDate() + '(' + U.WD[d.getDay()] + ')';
  },
  fmtFull: function (s) {
    var d = U.parseISO(s); if (!d) return '-';
    return d.getFullYear() + '.' + U.pad(d.getMonth() + 1) + '.' + U.pad(d.getDate());
  },
  fmtNum: function (n) { return Number(n || 0).toLocaleString('ko-KR'); },
  dday: function (iso){
    var d = U.parseISO(iso); if (!d) return { n: 999, label: '상시', cls: '' };
    var diff = Math.round((d - U.today()) / 86400000);
    if (diff < 0) return { n: diff, label: '마감', cls: 'closed' };
    if (diff === 0) return { n: 0, label: 'D-DAY', cls: 'soon' };
    return { n: diff, label: 'D-' + diff, cls: diff <= 3 ? 'soon' : '' };
  },
  timeToMin: function (t){ var p = String(t || '00:00').split(':'); return (+p[0]) * 60 + (+(p[1] || 0)); },
  minToTime: function (m){
    m = ((m % 1440) + 1440) % 1440;
    return U.pad(Math.floor(m / 60)) + ':' + U.pad(m % 60);
  },
  clamp: function (v, a, b){ return Math.max(a, Math.min(b, v)); },
  gradeNeed: function (criteria){
    var m = String(criteria || '').match(/(\d+)\s*회/);
    return m ? parseInt(m[1], 10) : 25;
  },
  gradeManner: function (criteria){
    var m = String(criteria || '').match(/매너\s*([\d.]+)/);
    return m ? m[1] : '4.6';
  },
  initials: function (name){
    var s = String(name || '?').replace(/[^가-힣a-zA-Z0-9]/g, '');
    return s.slice(0, 1).toUpperCase() || '?';
  },
  uid: function (prefix){
    return prefix + '-' + Date.now().toString(36).slice(-5).toUpperCase() + Math.floor(Math.random() * 90 + 10);
  },
  copy: function (text, msg){
    var done = function(){ if (msg) App.toast(msg); };
    if (navigator.clipboard && navigator.clipboard.writeText) {

  qs: function (k){ try { return new URLSearchParams(location.search).get(k); } catch (e){ return null; } }
};

  reviewOf: function (appId){ return Store.state.reviews.filter(function (r){ return r.appId === appId; })[0] || null; },
  reviewResult: function (r){
