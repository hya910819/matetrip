    return r.result;
  },
  branchOf: function (c, branchId){
    if (!c || !c.branches) return null;
    var b = c.branches.filter(function (x){ return x.id === branchId; })[0];
    if (!b) return null;
    var ov = Store.state.branchState[b.id] || {};
    return { id: b.id, name: b.name, area: b.area, capacity: ov.capacity != null ? ov.capacity : b.capacity, confirmed: b.confirmed, blocked: b.blocked || [] };
  },
  /* 내 등급 기준 혜택 */
  benefitFor: function (c, gradeKey){
    var gk = gradeKey || Store.viewer().grade;
    var pct = (c.gradeBenefit && c.gradeBenefit[gk]);
    if (pct === undefined || pct === null) pct = 0;
    if (pct >= 100) return { kind: 'full', pct: 100, label: '100% 무료', short: '무료', desc: '제공 내역 전액 무료' };
    if (pct > 0) return { kind: 'partial', pct: pct, label: pct + '% 할인', short: pct + '%', desc: '제공 내역의 ' + (100 - pct) + '% 본인 부담' };
    return { kind: 'point', pct: 0, label: '포인트 적립', short: 'P', desc: '제공 내역 본인 결제 · ' + U.fmtNum(c.points || 0) + 'P 적립' };
  },
  isEligible: function (c, gradeKey){
    var gk = gradeKey || Store.viewer().grade;
    var pct = c.gradeBenefit ? c.gradeBenefit[gk] : 0;
    return pct !== undefined && pct !== null && pct > 0;
  },
  nextGrade: function (creator){
    var g = Store.grade(creator.grade);
    var idx = GRADE_ORDER.indexOf(g.key);
    if (idx >= GRADE_ORDER.length - 1) return null;
    return GRADES[GRADE_ORDER[idx + 1]];
  },
  monthlyFreeUsed: function (creatorId){
    var now = new Date();
    return Store.state.applications.filter(function (a){
      if (a.creatorId !== creatorId) return false;
      if (a.status !== 'passed') return false;
      var d = U.parseISO(a.appliedAt);
      return d && d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
    }).length;
  },
  nextId: function (prefix){
    Store.state.lastId = (Store.state.lastId || 2420) + 1;
    return prefix + '-' + Store.state.lastId;
  },

  /* ------------------------------------------------------------- 변경 -- */
  addApplication: function (data){
    var app = {
      id: Store.nextId('AP'),
      campaignId: data.campaignId,
      branchId: data.branchId || '',
      creatorId: Store.state.viewerId,
      media: data.media,
      status: 'review',
      appliedAt: U.iso(U.today()),
      visitAt: data.visitAt || '',
      visitTime: data.visitTime || '',
      contact: data.contact,
      url: data.url || '',
      blogType: data.blogType || '',
      followers: data.followers || 0,
      visitors: data.visitors || 0,
      posts: data.posts || 0,
      note: data.note || '',
      receivedAt: new Date().toISOString()
    };
    Store.state.applications.unshift(app);
    Store.save();
    return app;
  },
  setAppStatus: function (id, status, note){
    var a = Store.app(id); if (!a) return null;
    a.status = status;
    if (note != null) a.adminNote = note;
    Store.save();
    return a;
  },
  removeApplication: function (id){
    Store.state.applications = Store.state.applications.filter(function (a){ return a.id !== id; });
    Store.state.reviews = Store.state.reviews.filter(function (r){ return r.appId !== id; });
    Store.save();
  },
  addReview: function (data){
    var rv = {
      id: Store.nextId('RV'), appId: data.appId, campaignId: data.campaignId, creatorId: data.creatorId,
      media: data.media, url: data.url, title: data.title, body: data.body,
      checklist: data.checklist, result: data.result, submittedAt: U.iso(U.today()),
      adminStatus: data.result && data.result.status === 'pass' ? 'passed' : 'submitted',
      adminNote: ''
    };
    Store.state.reviews.unshift(rv);
    var app = Store.app(data.appId);
    if (app) app.status = rv.adminStatus === 'passed' ? 'passed' : 'submitted';
    Store.save();
    return rv;
  },
  setReviewStatus: function (id, status, note){
    var r = Store.state.reviews.filter(function (x){ return x.id === id; })[0];
    if (!r) return null;
    r.adminStatus = status;
    if (note != null) r.adminNote = note;
    var app = Store.app(r.appId);
    if (app) {
      app.status = status === 'passed' ? 'passed' : (status === 'fix' ? 'fix' : 'submitted');
      if (status === 'fix') app.status = 'fix';
    }
    Store.save();
    return r;
  },
  addManner: function (data){
    var m = {
      id: Store.nextId('MN'), creatorId: data.creatorId, by: data.by, byType: data.byType || 'store',
      stars: data.stars, tags: data.tags || [], comment: data.comment || '', at: U.iso(U.today())
    };
    Store.state.manners.unshift(m);
    if (data.creatorId) {
      var cr = Store.creator(data.creatorId);
      if (cr) {
        var all = Store.state.manners.filter(function (x){ return x.creatorId === cr.id && x.byType === 'store'; });
        var avg = all.reduce(function (s, x){ return s + Number(x.stars); }, 0) / Math.max(1, all.length);
        cr.manner = Math.round(avg * 10) / 10;
      }
    }
    Store.save();
    return m;
  },
  invite: function (creatorId, campaignId){
    var exist = Store.state.invitations.filter(function (i){ return i.creatorId === creatorId && i.campaignId === campaignId && i.status === 'pending'; })[0];
    if (exist) return exist;
    var inv = { id: Store.nextId('IV'), creatorId: creatorId, campaignId: campaignId, at: U.iso(U.today()), status: 'pending' };
    Store.state.invitations.unshift(inv);
    Store.save();
    return inv;
  },
  setCapacity: function (campaignId, branchId, delta){
    var c = Store.campaign(campaignId);
    if (!c) return;
    if (branchId) {
      var b = Store.branchOf(c, branchId); if (!b) return;
      var ov = Store.state.branchState[branchId] || {};
      ov.capacity = U.clamp(b.capacity + delta, b.confirmed, 40);
      Store.state.branchState[branchId] = ov;
    } else {
      var cs = Store.state.campaignState[campaignId] || {};
      var cur = cs.capacity != null ? cs.capacity : c.capacity;
      cs.capacity = U.clamp(cur + delta, c.confirmed, 60);
      Store.state.campaignState[campaignId] = cs;
    }
    Store.save();
  },
  togglePause: function (campaignId){
    var cs = Store.state.campaignState[campaignId] || {};
    cs.paused = !cs.paused;
    Store.state.campaignState[campaignId] = cs;
    Store.save();
    return cs.paused;
  }
};

/* ------------------------------------------------------------- 검수 엔진 -- */
var Inspector = {
  /* 영업시간 표기 정규화: '오후 5시', '17시', '17:00' → 17:00 */
  normalizeTimes: function (text){
    var out = [];
    var s = String(text || '');
    var re = /(오전|오후|새벽|밤|낮)?\s*(\d{1,2})\s*(?::|시)\s*(\d{2})?\s*분?/g;
    var m;
    while ((m = re.exec(s)) !== null) {
      var h = +m[2], mi = +(m[3] || 0);
      var ap = m[1];
      if (ap === '오후' && h < 12) h += 12;
      if (ap === '오전' && h === 12) h = 0;
      if ((ap === '새벽' || ap === '밤') && h < 12) h += 12;
      out.push(U.minToTime(h * 60 + mi));
    }
    return out;
  },
  hasFairTrade: function (text){
    return /(제공\s*받|제공받|무료로?\s*제공|체험단|서포터즈|협찬|경제적\s*대가|대가를?\s*받|지원받)/.test(text);
  },
  countOf: function (text, needle){
    if (!needle) return 0;
    var t = String(text).toLowerCase(), n = String(needle).toLowerCase(), c = 0, i = 0;
    while ((i = t.indexOf(n, i)) !== -1) { c++; i += n.length; }
    return c;
  },
  run: function (draft, campaign){
    var c = campaign;
    var media = MEDIA[draft.media] || MEDIA.blog;
    var text = [draft.title || '', draft.body || ''].join('\n');
    var body = String(draft.body || '');
    var items = [];
    var add = function (key, label, status, detail, weight){
      items.push({ key: key, label: label, status: status, detail: detail, weight: weight || 1 });
    };
    /* 1. 메인 키워드 */
    var mainCnt = Inspector.countOf(text, c.keywords.main);
    add('main', '메인 키워드', mainCnt > 0 ? 'pass' : 'fail',
      mainCnt > 0 ? '‘' + c.keywords.main + '’ ' + mainCnt + '회 포함' : '‘' + c.keywords.main + '’이(가) 본문에 없습니다', 3);
    /* 2. 개별 키워드 */
    var found = c.keywords.subs.filter(function (k){ return Inspector.countOf(text, k) > 0; });
    var need = c.keywords.subs.length >= 2 ? 2 : c.keywords.subs.length;
    var subStatus = found.length >= need ? 'pass' : (found.length > 0 ? 'warn' : 'fail');
    add('subs', '개별 키워드', subStatus,
      found.length >= need
        ? found.length + '개 포함 (' + found.join(', ') + ')'
        : '최소 ' + need + '개 필요 · 현재 ' + found.length + '개' + (found.length ? ' (' + found.join(', ') + ')' : ''), 2);
    /* 3. 공정위 대가성 문구 */
    var ft = Inspector.hasFairTrade(text);
    add('fair', '대가성 문구', ft ? 'pass' : 'fail',
      ft ? '‘제공받아/체험단’ 등 표기 확인' : '‘제공받아’, ‘체험단’ 등 경제적 대가 문구가 없습니다', 3);
    /* 4. 영업시간 */
    var hours = Inspector.hoursOf(c, draft.branchId);
    var times = Inspector.normalizeTimes(text);
    var hasOpen = times.indexOf(hours.open) >= 0;
    var hasClose = times.indexOf(hours.close) >= 0;
    var hasAnyTime = times.length > 0;
    var hourStatus = (hasOpen && hasClose) ? 'pass' : (hasAnyTime ? 'warn' : 'fail');
    add('hours', '영업시간 표기', hourStatus,
      hourStatus === 'pass' ? hours.open + '~' + hours.close + ' 표기 확인'
        : (hasAnyTime ? '매장 영업시간은 ' + hours.open + '~' + hours.close + '입니다 (표기 확인 필요)' : '영업시간(' + hours.open + '~' + hours.close + ') 표기가 없습니다'), 3);
    /* 5. 매장명 */
    var storeOk = Inspector.countOf(text, c.store) > 0 || Inspector.countOf(text, (typeof BRANDS !== 'undefined' && BRANDS[c.brand] ? BRANDS[c.brand].name : '')) > 0;
    add('store', '매장명 표기', storeOk ? 'pass' : 'fail',
      storeOk ? '매장명 확인' : '‘' + c.store + '’ 명칭이 본문에 없습니다', 2);
    /* 6. 해시태그 */
    var tagsFound = c.keywords.tags.filter(function (t){ return text.indexOf(t) >= 0; });
    var tagStatus = tagsFound.length === c.keywords.tags.length ? 'pass' : (tagsFound.length > 0 ? 'warn' : 'fail');
    add('tags', '필수 해시태그', tagStatus,
      tagsFound.length === c.keywords.tags.length
        ? c.keywords.tags.length + '개 모두 포함'
        : tagsFound.length + '/' + c.keywords.tags.length + '개 포함 · ' + c.keywords.tags.filter(function (t){ return text.indexOf(t) < 0; }).join(' '), 2);
    /* 7. 링크 형식 */
    var urlOk = media.urlPattern.test(String(draft.url || ''));
    add('url', '포스팅 링크', urlOk ? 'pass' : 'fail',
      urlOk ? '링크 형식 확인' : media.name + ' 링크 형식이 아닙니다 (' + media.urlHint + ')', 2);
    /* 8. 분량 */
    var len = body.replace(/\s/g, '').length;
    var minChars = media.minChars;
    var lenStatus = len >= minChars ? 'pass' : (len >= minChars * 0.6 ? 'warn' : 'fail');
    add('length', '본문 분량', lenStatus,
      lenStatus === 'pass' ? len + '자 (기준 ' + minChars + '자 이상)' : len + '자 · 기준 ' + minChars + '자 이상 필요', 1);
    /* 9. 사진/영상 */
    var photos = Number(draft.checklist && draft.checklist.photos || 0);
    var minPhotos = c.mission.minPhotos;
    var photoStatus = photos >= minPhotos ? 'pass' : (photos > 0 ? 'warn' : 'fail');
    add('photos', (draft.media === 'blog' ? '사진 수량' : '영상/이미지'), photoStatus,
      draft.media === 'blog'
        ? photos + '장 (기준 ' + minPhotos + '장 이상)'
        : (photos > 0 ? '영상 1편 등록 확인' : '영상 1편이 필요합니다'), 2);
    /* 10. 영수증/방문 인증 */
    if (c.mission.receipt) {
      var rc = !!(draft.checklist && draft.checklist.receipt);
      add('receipt', '영수증 인증', rc ? 'pass' : 'fail', rc ? '영수증 인증 확인' : '영수증 인증이 필요합니다', 2);
    }
    /* 11. 금지·과장 표현 */
    var banned = (text.match(/최고|최강|1위|무조건|완치|부작용\s*없|100%\s*효과/g) || []);
    if (banned.length) add('banned', '과장 표현', 'warn', '삭제 권장: ' + banned.slice(0, 3).join(', '), 0.5);
    else add('banned', '과장 표현', 'pass', '문제 표현 없음', 0.5);

    var totalW = 0, gotW = 0;
    items.forEach(function (it){
      totalW += it.weight;
      gotW += it.status === 'pass' ? it.weight : (it.status === 'warn' ? it.weight * 0.6 : 0);
    });
    var score = Math.round(gotW / totalW * 100);
    var criticalFail = items.some(function (it){ return it.weight >= 3 && it.status === 'fail'; });
    var status = score >= 90 && !criticalFail ? 'pass' : (score >= 60 ? 'fix' : 'reject');
    if (status === 'pass' && items.some(function (it){ return it.status === 'warn'; })) status = 'fix';
    var fixes = items.filter(function (it){ return it.status !== 'pass'; }).map(function (it){ return '· ' + it.label + ': ' + it.detail; });
    return { score: score, status: status, items: items, fixes: fixes };
  },
  hoursOf: function (c, branchId){
    return c.hours || { open: '11:00', close: '22:00' };
  }
};

/* -------------------------------------------------------- 자동 매칭 점수 -- */
/* 신청자(크리에이터 + 캠페인) 기준 0~100점 · A(85↑)/B(70~84)/C(70미만)
   활동성 30 + 적합도 30 + 우리 캠페인 이력 25 + 매너 15 = 100 */
var MATCH_GRADE_META = {
  A: { key: 'A', label: 'A등급', tone: 'a', desc: '바로 선정 추천', min: 85 },
  B: { key: 'B', label: 'B등급', tone: 'b', desc: '검토 후 선정 추천', min: 70 },
  C: { key: 'C', label: 'C등급', tone: 'c', desc: '신중 검토', min: 0 }
};

var Matcher = {
  A_MIN: 85,
  B_MIN: 70,
  GROUP_OF: {
    '술집': '주점', '요리주점': '주점', '주점': '주점', '야식': '주점', '유흥': '주점', '바': '주점', '호프': '주점',
    '맛집': '음식', '일식': '음식', '초밥': '음식', '베이커리': '음식', '브런치': '음식', '디저트': '음식', '카페': '음식',
    '노래방': '공간', '룸': '공간', '공간': '공간', '플레이스': '공간'
  },
  NEAR_REGION: {
    '대구': ['경북', '부산', '울산', '경남'],
    '부산': ['대구', '울산', '경남'],
    '울산': ['부산', '경남', '대구'],
    '경북': ['대구', '경남'],
    '경남': ['부산', '울산', '대구', '경북'],
    '서울': ['경기', '인천'],
    '경기': ['서울', '인천'],
    '인천': ['서울', '경기']
  },
  REACH_TIERS: {
    blog: [[3000, 18], [2000, 17], [1200, 15], [800, 14], [400, 11], [150, 7], [50, 4]],
    video: [[50000, 18], [30000, 17], [15000, 15], [8000, 13], [3000, 10], [1000, 7], [200, 4]]
  },
  POST_TIERS: [[20, 12], [12, 10], [8, 9], [5, 7], [2, 4], [1, 2]],
  DONE_TIERS: [[40, 22], [25, 19], [15, 16], [8, 13], [3, 8]],
  
  tokens: function (s){
    return String(s == null ? '' : s).split(/[·,\/|>]/).map(function (t){ return t.trim(); }).filter(function (t){ return t; });
  },
  tier: function (value, tiers, base){
    for (var i = 0; i < tiers.length; i++) { if (value >= tiers[i][0]) return tiers[i][1]; }
    return base;
  },
  /* 팔로워·방문자 표기: 3,100 / 3.1만 */
  num: function (v){
    v = Number(v || 0);
    if (v >= 10000) return String(Math.round(v / 1000) / 10).replace(/\.0$/, '') + '만';
    return U.fmtNum(v);
  },
  gradeOf: function (score){
    if (score >= Matcher.A_MIN) return 'A';
    if (score >= Matcher.B_MIN) return 'B';
    return 'C';
  },
  gradeMeta: function (key){ return MATCH_GRADE_META[key] || MATCH_GRADE_META.C; },

  /* 1) 활동성 — 채널 규모 18 + 최근 30일 발행량 12 */
  reachScore: function (app, cr){
    var video = app.media !== 'blog';
    var value = Number(video ? (app.followers || cr.followers || 0) : (app.visitors || cr.visitors || 0));
    var got = Matcher.tier(value, video ? Matcher.REACH_TIERS.video : Matcher.REACH_TIERS.blog, 2);
    var label = video ? '팔로워' : '일방문';
    return {
      key: 'reach', label: '채널 규모', got: got, max: 18,
      detail: label + ' ' + Matcher.num(value) + (video ? '' : '명'),
      short: label + ' ' + Matcher.num(value)
    };
  },
  postsScore: function (app, cr){
    var posts = Number(app.posts || cr.posts30 || 0);
    return {
      key: 'posts', label: '최근 30일 게시글', got: Matcher.tier(posts, Matcher.POST_TIERS, 0), max: 12,
      detail: posts ? posts + '건' : '게시글 수 미입력', short: posts + '건'
    };
  },

  /* 2) 적합도 — 지역 12 + 카테고리 12 + 매체 6 */
  regionScore: function (cr, c){
    var regions = Matcher.tokens(c.region);
    var mine = String(cr.region || '').trim();
    var full = regions.indexOf(mine) >= 0;
    if (full) {
      return { key: 'region', label: '지역 적합', got: 12, max: 12, full: true,
        detail: mine + ' 활동 · 캠페인 지역과 일치', short: mine };
    }
    var near = regions.some(function (r){
      return (Matcher.NEAR_REGION[r] || []).indexOf(mine) >= 0 || (Matcher.NEAR_REGION[mine] || []).indexOf(r) >= 0;
    });
    return {
      key: 'region', label: '지역 적합', got: near ? 6 : 2, max: 12, full: false,
      detail: mine + ' 활동 · ' + (near ? regions.join('·') + ' 인접 지역' : regions.join('·') + ' 캠페인'),
      short: mine + ' 위주'
    };
  },
  categoryScore: function (cr, c){
    var theirs = Matcher.tokens(c.category);
    var mine = Matcher.tokens(cr.category);
    var exact = mine.some(function (t){ return theirs.indexOf(t) >= 0; });
    var same = false, broad = false;
    mine.forEach(function (m){
      var gm = Matcher.GROUP_OF[m];
      if (!gm) return;
      theirs.forEach(function (t){
        var gt = Matcher.GROUP_OF[t];
        if (!gt) return;
        if (gm === gt) same = true;
        if ((gm === '주점' || gm === '음식') && (gt === '주점' || gt === '음식')) broad = true;
      });
    });
    var got = exact ? 12 : (same ? 9 : (broad ? 6 : 2));
    return {
      key: 'category', label: '카테고리 적합', got: got, max: 12,
      detail: cr.category + ' → ' + c.category + (exact ? ' 일치' : (same ? ' 같은 업종군' : (broad ? ' 업종 인접' : ' 불일치'))),
      short: cr.category
    };
  },
  mediaScore: function (app, cr, c){
    var mine = cr.media || [];
    var onMedia = mine.indexOf(app.media) >= 0;
    var overlap = mine.some(function (m){ return (c.media || []).indexOf(m) >= 0; });
    return {
      key: 'media', label: '매체 적합', got: onMedia ? 6 : (overlap ? 3 : 1), max: 6,
      detail: onMedia ? MEDIA[app.media].short + ' 주력 · 신청 매체 일치'
        : (overlap ? '주력 매체 일부 일치 (' + mine.map(function (m){ return MEDIA[m].short; }).join('·') + ')'
          : '주력 매체 불일치 (' + mine.map(function (m){ return MEDIA[m].short; }).join('·') + ')')
    };
  },

  /* 3) 우리 캠페인 이력 — 완료 실적 22 + 브랜드 재방문 2 − 노쇼·수정요청 */
  recentFixes: function (creatorId){
    var limit = U.iso(U.addDays(U.today(), -60));
    return Store.state.reviews.filter(function (r){
      return r.creatorId === creatorId && r.adminStatus === 'fix' && String(r.submittedAt || '') >= limit;
    }).length;
  },
  brandReturn: function (app, cr, c){
    var brand = c.brand;
    var hit = Store.state.applications.filter(function (x){
      if (x.id === app.id || x.creatorId !== cr.id) return false;
      var xc = Store.campaign(x.campaignId);
      if (!xc || xc.brand !== brand) return false;
      return ['selected', 'visited', 'submitted', 'passed', 'fix'].indexOf(x.status) >= 0;
    });
    return hit.length ? (BRANDS[brand] || {}).name || '' : '';
  },
  historyScore: function (app, cr, c){
    var done = Matcher.tier(Number(cr.done || 0), Matcher.DONE_TIERS, 4);
    var noshow = Number(cr.noshow || 0);
    var fixes = Matcher.recentFixes(cr.id);
    var brandName = Matcher.brandReturn(app, cr, c);
    var items = [
      { key: 'done', label: '완료 실적', got: done, max: 22, detail: '우리 캠페인 ' + Number(cr.done || 0) + '회 완료' },
      { key: 'noshow', label: '노쇼 감점', got: noshow ? -Math.min(10, noshow * 5) : 0, max: 0, detail: '노쇼 ' + noshow + '회' },
      { key: 'fix', label: '수정요청 감점', got: fixes ? -Math.min(8, fixes * 4) : 0, max: 0, detail: '최근 60일 ' + fixes + '회' }
    ];
    if (brandName) items.push({ key: 'brand', label: '브랜드 재방문', got: 2, max: 2, detail: brandName + ' 재방문' });
    var raw = items.reduce(function (s, it){ return s + it.got; }, 0);
    return { items: items, got: U.clamp(raw, 0, 25), noshow: noshow, fixes: fixes, brandName: brandName, done: done };
  },

  /* 4) 매너 — 매장 평가 별점 15 */
  mannerScore: function (cr){
    var m = Number(cr.manner || 0);
    return { got: Math.round(U.clamp((m - 3.4) / 1.6, 0, 1) * 15), max: 15, detail: m.toFixed(1) + '점' };
  },

  /* 한 줄 사유 — 가점/감점 핵심만 */
  reasonOf: function (ctx){
    var pos = [], neg = [];
    if (ctx.region.full && ctx.category.got >= 9) {
      pos.push({ t: ctx.region.short + '·' + (Matcher.tokens(ctx.campaign.category)[0] || '적합') + ' 적합' });
    } else if (ctx.region.full) {
      pos.push({ t: ctx.region.short + ' 지역 적합' });
    }
    pos.push({ t: ctx.reach.short });
    if (ctx.brandName) pos.push({ t: ctx.brandName + ' 재방문' });
    if (ctx.noshow > 0) neg.push({ t: '노쇼 ' + ctx.noshow + '회', neg: true });
    if (ctx.fixes > 0) neg.push({ t: '최근 수정요청 ' + ctx.fixes + '회', neg: true });
    if (!ctx.region.full) neg.push({ t: ctx.region.short + ' · ' + ctx.campaign.region + ' 캠페인', neg: true });
    if (ctx.category.got <= 6) neg.push({ t: '카테고리 ' + (ctx.category.got >= 6 ? '인접' : '불일치'), neg: true });
    var out, seen = {};
    var push = function (p){
      if (seen[p.t] || out.length >= 3) return;
      seen[p.t] = 1; out.push(p);
    };
    out = [];
    if (!neg.length) {
      pos.forEach(push);
    } else {
      pos.slice(0, 2).forEach(push);
      neg.slice(0, 2).forEach(push);
    }
    return out;
  },

  run: function (app){
    var cr = Store.creator(app.creatorId);
    var c = Store.campaign(app.campaignId);
    if (!cr || !c) {
      return { score: 0, grade: 'C', meta: MATCH_GRADE_META.C, groups: [], items: [], parts: [], reasonText: '', cr: cr || {} };
    }
    var region = Matcher.regionScore(cr, c);
    var category = Matcher.categoryScore(cr, c);
    var media = Matcher.mediaScore(app, cr, c);
    var reach = Matcher.reachScore(app, cr);
    var posts = Matcher.postsScore(app, cr);
    var history = Matcher.historyScore(app, cr, c);
    var manner = Matcher.mannerScore(cr);

    var groups = [
      { key: 'activity', label: '활동성', icon: 'chart', max: 30, desc: '채널 규모 · 최근 발행량', items: [reach, posts] },
      { key: 'fit', label: '적합도', icon: 'target', max: 30, desc: '지역 · 카테고리 · 매체', items: [region, category, media] },
      { key: 'history', label: '이력', icon: 'book', max: 25, desc: '우리 캠페인 실적 · 감점', items: history.items },
      { key: 'manner', label: '매너', icon: 'heart', max: 15, desc: '매장 매너 평가', items: [{ key: 'manner', label: '매너 점수', got: manner.got, max: manner.max, detail: manner.detail }] }
    ];
    groups.forEach(function (g){
      g.got = U.clamp(g.items.reduce(function (s, it){ return s + it.got; }, 0), 0, g.max);
    });
    var score = U.clamp(groups.reduce(function (s, g){ return s + g.got; }, 0), 0, 100);
    var grade = Matcher.gradeOf(score);
    var parts = Matcher.reasonOf({
      region: region, category: category, reach: reach,
      noshow: history.noshow, fixes: history.fixes,
      brandName: history.brandName, campaign: c
    });
    return {
      score: score, grade: grade, meta: Matcher.gradeMeta(grade),
      groups: groups, items: groups.reduce(function (a, g){ return a.concat(g.items); }, []),
      parts: parts, reasonText: parts.map(function (p){ return p.t; }).join(' · '),
      cr: cr, campaign: c,
      facts: { done: cr.done || 0, manner: cr.manner || 0, noshow: history.noshow, fixes: history.fixes, brandName: history.brandName }
    };
  }
};

/* ------------------------------------------------------------ 웹훅 브리지 -- */
var Hook = {
  enabled: function (){ return !!(Store.state.settings && Store.state.settings.webhookUrl); },
  send: function (action, payload, cb){
    var url = Store.state.settings.webhookUrl;
    if (!url) { cb && cb({ ok: false, code: 'demo', message: '데모 모드' }); return; }
    var cbName = 'grHook_' + Math.random().toString(36).slice(2);
    var script = document.createElement('script');
    var done = false;
    window[cbName] = function (res){ done = true; cleanup(); cb && cb(res || { ok: false }); };
    function cleanup(){
      try { delete window[cbName]; } catch (e) { window[cbName] = undefined; }
      if (script.parentNode) script.parentNode.removeChild(script);
    }
    var qs = ['action=' + encodeURIComponent(action), 'callback=' + cbName];
    if (Store.state.settings.secretKey) qs.push('key=' + encodeURIComponent(Store.state.settings.secretKey));
    Object.keys(payload || {}).forEach(function (k){
      var v = payload[k];
      if (v === undefined || v === null) return;
      if (typeof v === 'object') v = JSON.stringify(v);
      qs.push(encodeURIComponent(k) + '=' + encodeURIComponent(v));
    });
    script.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + qs.join('&');
    script.onerror = function (){ if (done) return; done = true; cleanup(); cb && cb({ ok: false, code: 'network', message: '접수 서버에 연결하지 못했습니다.' }); };
    document.head.appendChild(script);
    setTimeout(function (){ if (done) return; done = true; cleanup(); cb && cb({ ok: false, code: 'timeout', message: '응답이 지연되고 있습니다.' }); }, 12000);
  }
};

  filtered: function (){

      if (f.media && c.media.indexOf(f.media) < 0) return false;
      if (f.visitType && c.visitType !== f.visitType) return false;
      if (f.multi && !c.multi) return false;
      if (f.region && c.region.indexOf(f.region) < 0) return false;
      if (f.brand && c.brand !== f.brand) return false;
      if (f.gradeOnly && !Store.isEligible(c)) return false;
      if (f.benefit && Store.benefitFor(c).kind !== f.benefit) return false;
      if (q) {
        var hay = [c.store, c.campaignName, c.area, BRANDS[c.brand] && BRANDS[c.brand].name, c.keywords.main, c.keywords.subs.join(' '), c.category, c.provide].join(' ').toLowerCase();
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    });

                '<li>' + icon('check') + '리뷰 자동 검수</li>' +

            '<aside class="grade-card g-' + g.key + '" aria-label="내 등급 요약">' +

        '</section>' +

        '<div class="section-head" style="margin-bottom:0">' +

        '</div>' +
        '<div class="shelf">' + ViewExplore.shelf() + '</div>' +

        ViewExplore.filters() +

        '<div id="listAnchor"></div>' +
        '<div class="section-head" style="margin-top:22px">' +
          '<div><h2 style="margin-top:0">모집 중인 체험단</h2><p>내 등급 기준 혜택이 카드에 바로 표시됩니다.</p></div>' +
          '<div class="tiny">신청 가능 <b style="color:var(--ink)">' + eligible + '건</b> / 전체 ' + openCount + '건</div>' +
        '</div>' +
        (list.length

  slotHTML: function (c, blocked){
    var open = U.timeToMin(c.hours.open), close = U.timeToMin(c.hours.close);
    if (close <= open) close += 1440;
    var blocks = (blocked || []).map(function (b){
      var f = U.timeToMin(b.from), t = U.timeToMin(b.to);
      if (t <= f) t += 1440;
      return { f: f, t: t, label: b.label };
    });
    var cells = [];
    for (var m = open; m < close; m += 60) {
      var on = blocks.some(function (b){ return m < b.t && m + 60 > b.f; });
      var tm = m % 1440;
      cells.push('<div class="slot' + (on ? ' blocked' : '') + '"><span class="slot-bar"></span><span>' + U.pad(Math.floor(tm / 60)) + '</span></div>');
    }
    return '<div class="slot-wrap"><div class="slot-head"><span>' + U.esc(c.hours.open) + ' 오픈</span><span>' + U.esc(c.hours.close) + ' 마감</span></div><div class="slot-grid">' + cells.join('') + '</div>' +
      (blocks.length ? '<div class="tiny" style="margin-top:6px;color:#b4453f">' + blocks.map(function (b){ return U.esc(b.label) + ' ' + U.minToTime(b.f) + '~' + U.minToTime(b.t); }).join(' / ') + '</div>' : '') +
      '</div>';
  },

    if (close <= open) close += 1440;
    var out = [];
    for (var m = open; m < close; m += 60) {
      var tm = m % 1440;
      var label = U.pad(Math.floor(tm / 60)) + ':00';
      var blocked = blocks.some(function (bl){
        var f = U.timeToMin(bl.from), t = U.timeToMin(bl.to);
        if (t <= f) t += 1440;
        return m < t && m + 60 > f;
      });
      var isOpen = false;
      for (var i = 0; i < out.length; i++) if (!out[i].blocked) isOpen = true;
      out.push({ value: label, label: label, blocked: blocked });
    }
    var firstOpen = out.filter(function (o){ return !o.blocked; })[0];
    return out.map(function (o){
      if (o.blocked) return '<option value="' + o.value + '" disabled>' + o.label + ' (제외)</option>';
      return '<option value="' + o.value + '"' + (firstOpen && firstOpen.value === o.value ? ' selected' : '') + '>' + o.label + '</option>';
    }).join('');
  },

  mediaFields: function (m, c){
    var v = Store.viewer();
    if (m === 'blog') {
      return '<label for="aUrl">블로그 주소 <span class="req">*</span></label>' +
        '<input class="input" id="aUrl" name="url" value="' + U.esc(v.blogUrl || '') + '" placeholder="https://blog.naver.com/아이디" inputmode="url">' +
        '<div class="form-grid" style="margin-top:9px;gap:9px">' +
          '<div class="field"><label>블로그 유형</label><div class="seg">' +
            ['준', '최적화', '인플'].map(function (t, i){ return '<label><input type="radio" name="blogType" value="' + t + '"' + (i === 1 ? ' checked' : '') + '>' + t + '</label>'; }).join('') +
          '</div></div>' +
          '<div class="field"><label for="aVisitors">일 방문자수</label><input class="input" id="aVisitors" name="visitors" type="number" min="0" placeholder="예: 450" value="' + (v.visitors || '') + '"></div>' +
          '<div class="field"><label for="aPosts">최근 30일 게시글</label><input class="input" id="aPosts" name="posts" type="number" min="0" placeholder="예: 12"></div>' +
        '</div>' +
        '<span class="hint">시트의 ‘블로그유형(준/최적화/인플)’ 항목과 그대로 연결됩니다.</span><span class="err" id="eUrl"></span>';
    }
    var label = m === 'reels' ? '인스타그램 계정 주소' : (m === 'shorts' ? '유튜브 채널 주소' : '틱톡 계정 주소');
    return '<label for="aUrl">' + label + ' <span class="req">*</span></label>' +
      '<input class="input" id="aUrl" name="url" value="" placeholder="' + MEDIA[m].urlHint + '" inputmode="url">' +
      '<div class="form-grid" style="margin-top:9px;gap:9px">' +
        '<div class="field"><label for="aFollowers">팔로워 수</label><input class="input" id="aFollowers" name="followers" type="number" min="0" placeholder="예: 12000" value="' + (v.followers || '') + '"></div>' +
        '<div class="field"><label for="aViews">최근 콘텐츠 평균 조회수</label><input class="input" id="aViews" name="avgViews" type="number" min="0" placeholder="예: 32000"></div>' +
      '</div>' +
      '<span class="hint">릴스·쇼츠·틱톡은 최근 30일 평균 조회수를 기준으로 선정합니다.</span><span class="err" id="eUrl"></span>';
  },

  done: function (app, c, result){
    var brand = BRANDS[c.brand] || { name: c.store, c1: '#2f4bff', c2: '#7a5cff' };
    var b = Store.benefitFor(c);
    var branch = app.branchId ? Store.branchOf(c, app.branchId) : null;
    var synced = result && result.synced;
    return '<div class="done-screen">' +
      '<div class="done-badge">' + icon('check') + '</div>' +
      '<h2>신청이 접수되었습니다</h2>' +
      '<p class="sub">' + (c.visitType === 'free' ? '선정 안내 후 방문 기간 내 자유롭게 방문해 주세요.' : '광고주 검토 후 선정 결과를 연락처로 안내드립니다.') + '</p>' +
      '<div class="receipt">접수번호 <b>' + U.esc(app.id) + '</b></div>' +
      '<dl class="done-summary">' +
        '<div><dt>캠페인</dt><dd>' + U.esc(c.store) + (branch ? ' · ' + U.esc(branch.name) : '') + '</dd></div>' +
        '<div><dt>매체</dt><dd>' + U.esc(MEDIA[app.media].name) + '</dd></div>' +
        '<div><dt>방문 희망</dt><dd>' + U.fmtMD(app.visitAt) + (app.visitTime ? ' ' + U.esc(app.visitTime) : '') + '</dd></div>' +
        '<div><dt>내 등급 혜택</dt><dd>' + b.label + '</dd></div>' +
        '<div><dt>접수 경로</dt><dd>' + (synced ? '구글 시트 2_모집_선정_스케줄 전송 완료' : '데모 저장 (브라우저 localStorage)') + '</dd></div>' +
      '</dl>' +
      '<div class="form-actions" style="margin-top:18px">' +
        '<button class="btn primary" data-act="goMy">마이페이지에서 확인' + icon('arrowRight') + '</button>' +
        '<button class="btn ghost" data-act="closeModal">다른 캠페인 보기</button>' +
      '</div>' +
      '<p class="done-note">' + (synced ? '시트의 2_모집_선정_스케줄 마지막 행에서 확인할 수 있습니다.' : '웹훅 주소를 연결하면 신청이 구글 시트로 바로 들어갑니다. (설정 → 시트 연동)') + '</p>' +
    '</div>';
  }
};

</script>
<script>
/* =========================================================================
   메이트립 (MATETRIP) v2 — ② 마이페이지 (내 신청 · 등급 · 리뷰 제출)
   ========================================================================= */
'use strict';

var STATUS_META = {
  review:    { label: '검토중',   cls: 'st-review',    step: 0 },
  selected:  { label: '선정',     cls: 'st-selected',  step: 1 },
  visited:   { label: '방문완료', cls: 'st-visited',   step: 2 },
  submitted: { label: '검수중',   cls: 'st-submitted', step: 3 },
  passed:    { label: '검수통과', cls: 'st-passed',    step: 4 },
  fix:       { label: '수정요청', cls: 'st-fix',       step: 3 },
  rejected:  { label: '미선정',   cls: 'st-rejected',  step: 0 },
  noshow:    { label: '노쇼',     cls: 'st-noshow',    step: 2 }
};
var STEPS = ['신청', '선정', '방문', '리뷰 제출', '검수 완료'];

var ViewMy = {
  statusPill: function (s){
    var m = STATUS_META[s] || STATUS_META.review;
    return '<span class="st ' + m.cls + '"><span class="dot"></span>' + m.label + '</span>';
  },

  stepper: function (app){
    var m = STATUS_META[app.status] || STATUS_META.review;
    if (app.status === 'rejected') {
      return '<div class="stepper"><span class="stp done"><i>✓</i>신청</span><span class="stp-line done"></span><span class="stp"><i>!</i>미선정</span></div>';
    }
    var out = [];
    STEPS.forEach(function (label, i){
      var cls = i < m.step ? 'done' : (i === m.step ? 'now' : '');
      out.push('<span class="stp ' + cls + '"><i>' + (i < m.step ? '✓' : (i + 1)) + '</i>' + label + '</span>');
      if (i < STEPS.length - 1) out.push('<span class="stp-line ' + (i < m.step ? 'done' : '') + '"></span>');
    });
    return '<div class="stepper">' + out.join('') + '</div>';
  },

  /* -------------------------------------------------------------- 신청 내역 */
  appRow: function (app){
    var c = Store.campaign(app.campaignId);
    if (!c) return '';
    var br = app.branchId ? Store.branchOf(c, app.branchId) : null;
    var brand = BRANDS[c.brand] || {};
    var meta = STATUS_META[app.status] || STATUS_META.review;
    var actions = '';
    if (app.status === 'review') {
      actions = '<button class="btn ghost sm" data-act="cancelApp" data-id="' + app.id + '">신청 취소</button>';
    } else if (app.status === 'selected') {
      actions = '<button class="btn ghost sm" data-act="changeVisit" data-id="' + app.id + '">일정 변경</button>' +
                '<button class="btn primary sm" data-act="startReview" data-id="' + app.id + '">리뷰 제출</button>';
    } else if (app.status === 'visited' || app.status === 'fix') {
      actions = '<button class="btn primary sm" data-act="startReview" data-id="' + app.id + '">' + (app.status === 'fix' ? '수정 후 재제출' : '리뷰 제출') + '</button>';
    } else if (app.status === 'submitted') {
      actions = '<button class="btn ghost sm" data-act="openReviewResult" data-id="' + app.id + '">검수 결과</button>';
    } else if (app.status === 'passed') {
      actions = '<button class="btn ghost sm" data-act="openReviewResult" data-id="' + app.id + '">포스팅 보기</button>';
    } else if (app.status === 'rejected') {
      actions = '<button class="btn ghost sm" data-act="scrollList">다른 캠페인</button>';
    } else if (app.status === 'noshow') {
      actions = '<button class="btn ghost sm" data-act="openReviewResult" data-id="' + app.id + '">사유 보기</button>';
    }
    return '<div class="app-row">' +
      '<div class="ar-main">' +
        '<div class="ar-top"><span class="ar-store">' + U.esc(c.store) + (br ? ' · ' + U.esc(br.name) : '') + '</span>' +
          '<span class="tag">' + U.esc(MEDIA[app.media].short) + '</span>' +
          (c.multi ? '<span class="tag">다지점</span>' : '') +
        '</div>' +
        '<h4>' + U.esc(c.campaignName) + '</h4>' +
        '<div class="ar-meta"><span>접수 <b>' + U.fmtMD(app.appliedAt) + '</b></span>' +
          (app.visitAt ? '<span>방문 <b>' + U.fmtMD(app.visitAt) + (app.visitTime ? ' ' + U.esc(app.visitTime) : '') + '</b></span>' : '<span>방문일 미정</span>') +
          '<span>혜택 <b>' + Store.benefitFor(c, app.creatorId ? Store.creator(app.creatorId).grade : undefined).label + '</b></span></div>' +
        ViewMy.stepper(app) +
      '</div>' +
      '<div class="ar-side">' + ViewMy.statusPill(app.status) + actions + '</div>' +
    '</div>';
  },

  /* ------------------------------------------------------------ 리뷰 제출 탭 */
  eligibleApps: function (){
    return Store.appsOf(Store.state.viewerId).filter(function (a){
      return ['selected', 'visited', 'fix'].indexOf(a.status) >= 0;
    });
  },

  reviewTab: function (){
    var list = ViewMy.eligibleApps();
    if (!list.length) {
      return '<div class="empty-box"><b>지금 제출할 리뷰가 없습니다</b><p>캠페인에 선정되고 방문을 마치면 이곳에서 리뷰를 제출하고 바로 자동 검수를 받을 수 있어요.</p>' +
        '<button class="btn ghost sm" style="margin-top:14px" data-act="scrollList">모집 중 캠페인 보기</button></div>';
    }
    if (!App.reviewAppId || !Store.app(App.reviewAppId)) App.reviewAppId = list[0].id;
    var app = Store.app(App.reviewAppId);
    var c = Store.campaign(app.campaignId);
    if (!App.reviewDraft || App.reviewDraft.appId !== app.id) {
      App.reviewDraft = ViewMy.blankDraft(app, c);
    }
    var d = App.reviewDraft;
    var result = Inspector.run(d, c);
    return '' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">' +
        list.map(function (a){
          var cc = Store.campaign(a.campaignId);
          return '<button class="chip ' + (a.id === App.reviewAppId ? 'on' : '') + '" data-act="switchReviewApp" data-id="' + a.id + '">' +
            U.esc(cc.store) + ' · ' + U.esc(MEDIA[a.media].short) + (a.status === 'fix' ? ' · 수정' : '') + '</button>';
        }).join('') +
      '</div>' +
      '<div class="review-layout">' +
        '<div class="review-form">' +
          '<div class="rf-head"><div><h3>' + U.esc(MEDIA[app.media].name) + ' 리뷰 제출</h3>' +
            '<div class="target">' + U.esc(c.store) + ' · 메인 키워드 ‘' + U.esc(c.keywords.main) + '’</div></div>' +
            '<div class="rf-tools"><button class="btn ghost xs" data-act="loadSample" data-kind="bad">미흡 예시</button><button class="btn ghost xs" data-act="loadSample" data-kind="good">통과 예시</button></div>' +
          '</div>' +
          '<div class="form-grid">' +
            '<div class="field full"><label for="rUrl">포스팅 링크 <span class="req">*</span></label>' +
              '<input class="input" id="rUrl" data-draft="url" value="' + U.esc(d.url) + '" placeholder="' + MEDIA[app.media].urlHint + '" inputmode="url"><span class="err" id="eReviewUrl"></span></div>' +
            '<div class="field full"><label for="rTitle">제목 <span style="color:var(--muted-2);font-weight:600">(권장)</span></label>' +
              '<input class="input" id="rTitle" data-draft="title" value="' + U.esc(d.title) + '" placeholder="예: ' + U.esc(c.store) + ' ' + U.esc(c.keywords.main) + ' 후기" maxlength="120"></div>' +
            '<div class="field full"><label for="rBody">' + U.esc(MEDIA[app.media].label) + ' <span class="req">*</span></label>' +
              '<textarea id="rBody" data-draft="body" rows="9" placeholder="본문을 붙여넣으면 키워드·대가성 문구·영업시간을 즉시 검수합니다.">' + U.esc(d.body) + '</textarea>' +
              '<div class="char-count"><span id="charCount">' + String(d.body || '').replace(/\s/g, '').length + '</span>자 / 기준 ' + MEDIA[app.media].minChars + '자</div></div>' +
          '</div>' +
          '<div style="margin-top:14px"><div class="fs-head"><span class="fs-n">✓</span><h4>필수 체크리스트</h4><span class="fs-hint">검수에 반영됩니다</span></div>' +
            '<div class="checklist">' +
              '<label class="cl-item">' + icon('camera') + '사진 <input class="cl-num" type="number" min="0" max="99" data-draft="photos" value="' + (d.checklist.photos || 0) + '">장</label>' +
              (c.mission.receipt ? '<label class="cl-item"><input type="checkbox" data-draft="receipt"' + (d.checklist.receipt ? ' checked' : '') + '>영수증 인증</label>' : '') +
              '<label class="cl-item"><input type="checkbox" data-draft="visitProof"' + (d.checklist.visitProof ? ' checked' : '') + '>방문 인증</label>' +
              '<label class="cl-item"><input type="checkbox" data-draft="hashtags"' + (d.checklist.hashtags ? ' checked' : '') + '>필수 해시태그</label>' +
              '<label class="cl-item"><input type="checkbox" data-draft="disclosure"' + (d.checklist.disclosure ? ' checked' : '') + '>대가성 문구</label>' +
            '</div>' +
            '<div class="form-tip" style="margin-top:9px">' + icon('info') + '<span>체크리스트는 본문 검수와 함께 최종 판정에 반영됩니다. 본문에 실제로 들어 있는지도 자동으로 확인합니다.</span></div>' +
          '</div>' +
          '<div class="form-actions" style="margin-top:15px">' +
            '<button class="btn ghost" data-act="saveDraft">임시 저장</button>' +
            '<button class="btn primary" data-act="submitReview" data-id="' + app.id + '">검수 받고 제출' + icon('send') + '</button>' +
          '</div>' +
        '</div>' +
        '<div id="inspectPanel">' + ViewMy.inspector(result, c, app) + '</div>' +
      '</div>';
  },

  blankDraft: function (app, c){
    return {
      appId: app.id, campaignId: c.id, media: app.media, url: '', title: '', body: '',
      checklist: { photos: 0, receipt: false, visitProof: false, hashtags: false, disclosure: false }
    };
  },

  /* ------------------------------------------------------------- 검수 패널 */
  inspector: function (result, c, app){
    var color = result.status === 'pass' ? 'var(--green)' : (result.status === 'fix' ? '#e6a700' : 'var(--red)');
    var label = result.status === 'pass' ? '검수 통과' : (result.status === 'fix' ? '수정 후 제출' : '다시 작성');
    var desc = result.status === 'pass'
      ? '필수 항목을 모두 충족했습니다. 이대로 제출하면 검수 통과 처리됩니다.'
      : '아래 항목을 보완하면 통과 확률이 높아집니다. 수정 문구를 그대로 복사해 전달할 수 있어요.';
    var fixes = result.fixes.length ? result.fixes.join('\n') : '보완할 항목이 없습니다.';
    return '<div class="inspect">' +
      '<div class="inspect-head"><h3>' + icon('shield') + '자동 검수 리포트</h3><span class="auto">실시간</span></div>' +
      '<div class="score-row">' +
        '<div class="gauge" style="--p:' + result.score + ';--gc:' + color + '"><span class="gv"><b>' + result.score + '</b><span>/ 100</span></span></div>' +
        '<div class="score-meta"><div class="sm-status" style="color:' + color + '">' + label + '</div><div class="sm-desc">' + desc + '</div>' +
          '<div class="tiny" style="margin-top:5px">' + result.items.filter(function (i){ return i.status === 'pass'; }).length + '/' + result.items.length + '개 항목 통과</div>' +
        '</div>' +
      '</div>' +
      '<ul class="ck-list">' + result.items.map(function (it){
        return '<li class="ck ' + it.status + '"><span class="ck-ico">' + (it.status === 'pass' ? '✓' : (it.status === 'warn' ? '!' : '×')) + '</span>' +
          '<div class="ck-body"><b>' + it.label + '</b><span>' + U.esc(it.detail) + '</span></div>' +
          '<span class="ck-st">' + (it.status === 'pass' ? '통과' : (it.status === 'warn' ? '보완' : '실패')) + '</span></li>';
      }).join('') + '</ul>' +
      '<div class="inspect-note"><h4>수정 요청 문구 <button class="btn-link" data-act="copyFixes">' + icon('copy') + '복사</button></h4>' +
        '<pre id="fixText">' + U.esc(fixes) + '</pre></div>' +
    '</div>';
  },

  /* ------------------------------------------------------------ 매너·평가 탭 */
  mannerTab: function (){
    var v = Store.viewer();
    var received = Store.state.manners.filter(function (m){ return m.creatorId === v.id && m.byType === 'store'; });
    var given = Store.state.manners.filter(function (m){ return m.creatorId === v.id && m.byType === 'creator'; });
    var avg = received.length ? received.reduce(function (s, m){ return s + m.stars; }, 0) / received.length : v.manner;
    var stars = function (n){
      var out = '';
      for (var i = 1; i <= 5; i++) out += '<span style="color:' + (i <= n ? '#f0b429' : '#dfe4f0') + '">' + icon('starFill') + '</span>';
      return '<span class="stars">' + out + '</span>';
    };
    var tagCount = {};
    received.forEach(function (m){ (m.tags || []).forEach(function (t){ tagCount[t] = (tagCount[t] || 0) + 1; }); });
    return '<div class="manner-grid">' +
      '<div class="manner-card">' +
        '<h3>' + icon('star') + '받은 매너 평가</h3>' +
        '<div class="manner-score-lg"><b>' + avg.toFixed(1) + '</b><span>/ 5.0 · ' + received.length + '건</span></div>' +
        '<div style="margin-top:4px">' + stars(Math.round(avg)) + '</div>' +
        '<div class="pc-tags" style="margin-top:10px">' + Object.keys(tagCount).map(function (t){ return '<span class="tag">' + U.esc(t) + ' ' + tagCount[t] + '</span>'; }).join('') + '</div>' +
        '<div style="margin-top:8px">' +
          received.map(function (m){
            return '<div class="manner-item"><div class="mi-top"><b>' + U.esc(m.by) + '</b><span>' + stars(m.stars) + '</span></div>' +
              '<div class="mi-tags">' + (m.tags || []).map(function (t){ return '<span class="tag">' + U.esc(t) + '</span>'; }).join('') + '</div>' +
              '<div class="mi-comment">' + U.esc(m.comment) + '</div>' +
              '<div class="tiny" style="margin-top:3px">' + U.fmtMD(m.at) + '</div></div>';
          }).join('') +
        '</div>' +
      '</div>' +
      '<div style="display:flex;flex-direction:column;gap:14px">' +
        '<div class="manner-card">' +
          '<h3>' + icon('heart') + '내가 준 평가</h3>' +
          '<div style="margin-top:8px">' +
            (given.length ? given.map(function (m){
              return '<div class="manner-item"><div class="mi-top"><b>' + U.esc(m.target || m.by) + '</b><span>' + stars(m.stars) + '</span></div>' +
                '<div class="mi-comment">' + U.esc(m.comment) + '</div></div>';
            }).join('') : '<p class="tiny">아직 평가한 매장이 없습니다. 방문 완료 후 매장 매너를 평가할 수 있어요.</p>') +
          '</div>' +
        '</div>' +
        '<div class="notice-box">' + icon('alert') + '<span><b>노쇼 관리</b> 노쇼 1회당 매너 점수 0.5점이 차감되고, 3회 누적 시 3개월간 신청이 정지됩니다. 현재 노쇼 <b>' + v.noshow + '회</b>입니다.</span></div>' +
        '<div class="manner-card">' +
          '<h3>' + icon('info') + '매너 점수 산정 기준</h3>' +
          '<ul class="notes-list" style="margin-top:8px">' +
            '<li>광고주가 방문·리뷰 완료 후 별점과 태그로 평가합니다.</li>' +
            '<li>시간 약속 준수, 소통, 결과물 품질을 종합해 5점 만점으로 집계합니다.</li>' +
            '<li>노쇼 1회당 0.5점 차감 · 리뷰 미제출 1회당 0.3점 차감.</li>' +
            '<li>매너 점수는 등급 산정(레드 4.3 · 다이아 4.6 · 블랙 4.8)에 반영됩니다.</li>' +
          '</ul>' +
        '</div>' +
      '</div>' +
    '</div>';
  },

  /* ------------------------------------------------------------------ 페이지 */
  render: function (){
    var v = Store.viewer();
    var g = Store.grade(v.grade);
    var next = Store.nextGrade(v);
    var used = Store.monthlyFreeUsed(v.id);
    var apps = Store.appsOf(v.id).sort(function (a, b){ return String(b.appliedAt).localeCompare(String(a.appliedAt)); });
    var counts = { apps: apps.length, review: ViewMy.eligibleApps().length, manner: Store.state.manners.filter(function (m){ return m.creatorId === v.id; }).length };
    var tab = Store.state.ui.myTab || 'apps';
    var pct = next ? Math.min(96, Math.round((v.done / U.gradeNeed(next.criteria)) * 100)) : 100;
    var body = '';
    if (tab === 'apps') {
      body = apps.length
        ? '<div class="app-list">' + apps.map(ViewMy.appRow).join('') + '</div>'
        : '<div class="empty-box"><b>아직 신청한 캠페인이 없습니다</b><p>내 등급에 맞는 캠페인을 골라 첫 체험을 시작해 보세요.</p><button class="btn primary sm" style="margin-top:14px" data-act="scrollList">캠페인 둘러보기</button></div>';
    } else if (tab === 'review') {
      body = ViewMy.reviewTab();
    } else {
      body = ViewMy.mannerTab();
    }
    return '<div class="page page-my">' +
      '<div class="my-hero">' +
        '<div class="my-card my-identity">' +
          '<div class="mi-top">' +
            '<span class="mi-avatar">' + U.esc(U.initials(v.name)) + '</span>' +
            '<div style="min-width:0">' +
              '<div class="mi-name"><h2>' + U.esc(v.name) + '</h2><span class="gb ' + g.key + '">' + g.badge + '</span></div>' +
              '<div class="mi-handle">' + U.esc(v.handle) + ' · ' + U.esc(v.region) + ' · ' + U.esc(v.category) + '</div>' +
              '<div class="mi-tag">' + U.esc(g.tagline) + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="mi-grid">' +
            '<div class="mi-stat"><span>완료 캠페인</span><b>' + v.done + '회</b></div>' +
            '<div class="mi-stat"><span>매너 점수</span><b>' + v.manner.toFixed(1) + '</b></div>' +
            '<div class="mi-stat"><span>이번 달 무료</span><b>' + Math.max(0, g.monthlyFree - used) + ' / ' + g.monthlyFree + '회</b></div>' +
          '</div>' +
          '<div class="mi-meter">' +
            '<div class="mm-label"><span>' + (next ? next.name + '까지 ' + Math.max(0, U.gradeNeed(next.criteria) - v.done) + '회' : '최고 등급 유지 중') + '</span><span>' + pct + '%</span></div>' +
            '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
            '<div class="grade-ladder">' +
              GRADE_ORDER.map(function (k){
                return '<span class="gl-step ' + (GRADES[k].order <= g.order ? 'on' : '') + '"><span>' + GRADES[k].name + '</span></span>';
              }).join('') +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="my-right">' +
          '<div class="my-card">' +
            '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><h3 style="font-size:13.5px;font-weight:800">' + g.name + ' 등급 혜택</h3>' +
              '<span class="tiny">기준: ' + U.esc(g.criteria) + '</span></div>' +
            '<div class="perk-grid" style="margin-top:10px">' +
              g.perks.map(function (p){ return '<div class="perk">' + icon('check') + U.esc(p) + '</div>'; }).join('') +
            '</div>' +
          '</div>' +
          '<div class="my-card" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">' +
            '<div style="flex:1;min-width:180px"><h3 style="font-size:12.5px;font-weight:800">다음 등급까지</h3>' +
              '<p style="font-size:11.5px;color:var(--muted);margin-top:3px">' + (next ? '캠페인 ' + Math.max(0, U.gradeNeed(next.criteria) - v.done) + '회 더 완료하고 매너 ' + U.gradeManner(next.criteria) + ' 이상을 유지하세요.' : '이미 최고 등급입니다.') + '</p></div>' +
            '<button class="btn ghost sm" data-act="gradeGuide">등급 안내' + icon('arrowRight') + '</button>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="my-tabs" role="tablist">' +
        '<button class="' + (tab === 'apps' ? 'on' : '') + '" data-act="myTab" data-tab="apps">내 신청<span class="cnt">' + counts.apps + '</span></button>' +
        '<button class="' + (tab === 'review' ? 'on' : '') + '" data-act="myTab" data-tab="review">리뷰 제출·검수<span class="cnt">' + counts.review + '</span></button>' +
        '<button class="' + (tab === 'manner' ? 'on' : '') + '" data-act="myTab" data-tab="manner">매너·평가</button>' +
      '</div>' +
      body +
    '</div>';
  },

  /* ------------------------------------------------------- 검수 결과 모달 */
  resultModal: function (app){
    var c = Store.campaign(app.campaignId);
    var rv = Store.reviewOf(app.id);
    if (!c) return '';
    if (!rv) {
      return '<div class="settings-body"><h2>검수 결과가 없습니다</h2><p class="sub">리뷰를 제출하면 자동 검수 결과가 이곳에 표시됩니다.</p></div>';
    }
    var res = Store.reviewResult(rv);
    var color = res.status === 'pass' ? 'var(--green)' : (res.status === 'fix' ? '#e6a700' : 'var(--red)');
    return '<div class="settings-body">' +
      '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span class="st ' + (rv.adminStatus === 'passed' ? 'st-passed' : rv.adminStatus === 'fix' ? 'st-fix' : 'st-submitted') + '"><span class="dot"></span>' +
        (rv.adminStatus === 'passed' ? '검수 통과' : rv.adminStatus === 'fix' ? '수정 요청' : '검수 대기') + '</span>' +
        '<span class="tiny">' + U.esc(c.store) + ' · ' + U.esc(MEDIA[rv.media].name) + ' · ' + U.fmtMD(rv.submittedAt) + '</span></div>' +
      '<h2 style="margin-top:10px">' + U.esc(rv.title || '리뷰 검수 리포트') + '</h2>' +
      '<p class="sub" style="word-break:break-all"><a href="' + U.esc(rv.url) + '" target="_blank" rel="noopener noreferrer" style="color:var(--primary-700);font-weight:700">' + U.esc(rv.url) + '</a></p>' +
      '<div style="display:flex;gap:16px;align-items:center;margin-top:14px;flex-wrap:wrap">' +
        '<div class="gauge" style="--p:' + res.score + ';--gc:' + color + '"><span class="gv"><b>' + res.score + '</b><span>/ 100</span></span></div>' +
        '<div style="flex:1;min-width:200px"><div style="font-size:14px;font-weight:800;color:' + color + '">' + (res.status === 'pass' ? '자동 검수 통과' : res.status === 'fix' ? '수정 후 재제출 필요' : '다시 작성 필요') + '</div>' +
        (rv.adminNote ? '<div class="tiny" style="margin-top:4px">담당자 메모: ' + U.esc(rv.adminNote) + '</div>' : '') + '</div>' +
      '</div>' +
      '<ul class="ck-list" style="margin-top:14px">' + res.items.map(function (it){
        return '<li class="ck ' + it.status + '"><span class="ck-ico">' + (it.status === 'pass' ? '✓' : it.status === 'warn' ? '!' : '×') + '</span>' +
          '<div class="ck-body"><b>' + it.label + '</b><span>' + U.esc(it.detail) + '</span></div>' +
          '<span class="ck-st">' + (it.status === 'pass' ? '통과' : it.status === 'warn' ? '보완' : '실패') + '</span></li>';
      }).join('') + '</ul>' +
      (rv.adminStatus === 'fix' || res.status !== 'pass'
        ? '<div class="notice-box" style="margin-top:12px">' + icon('alert') + '<span>수정 요청 항목을 반영한 뒤 다시 제출해 주세요. 재제출하면 검수 대기열로 돌아갑니다.</span></div>' +
          '<div class="form-actions" style="margin-top:12px"><button class="btn primary" data-act="startReview" data-id="' + app.id + '">수정하고 재제출</button></div>'
        : '') +
    '</div>';
  }
};

</script>
<script>
/* =========================================================================
   메이트립 (MATETRIP) v2 — ③ 관리자 (광고주 · 그로스코리아 통합 관리)
   ========================================================================= */
'use strict';

/* ------------------------------------------------------------------ 차트 -- */
var Charts = {
  spark: function (values, color){
    var v = values.slice(), min = Math.min.apply(null, v), max = Math.max.apply(null, v);
    var w = 54, h = 22, n = v.length;
    var pts = v.map(function (x, i){
      var px = n === 1 ? w : i * (w / (n - 1));
      var py = max === min ? h / 2 : h - ((x - min) / (max - min)) * (h - 4) - 2;
      return (i ? 'L' : 'M') + px.toFixed(1) + ' ' + py.toFixed(1);
    }).join(' ');
    return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" fill="none" aria-hidden="true"><path d="' + pts + '" stroke="' + color + '" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>';
  },
  line: function (values, labels, opts){
    opts = opts || {};
    var w = 520, h = opts.height || 150, padL = 30, padR = 10, padT = 12, padB = 22;
    var v = values, min = Math.min.apply(null, v), max = Math.max.apply(null, v);
    if (opts.pad) { min -= 3; max += 3; }
    if (min === max) max = min + 1;
    var n = v.length;
    var x = function (i){ return padL + (n === 1 ? 0 : i * ((w - padL - padR) / (n - 1))); };
    var y = function (val){ return padT + (1 - (val - min) / (max - min)) * (h - padT - padB); };
    var pts = v.map(function (val, i){ return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(val).toFixed(1); }).join(' ');
    var area = pts + ' L' + x(n - 1).toFixed(1) + ' ' + (h - padB) + ' L' + x(0).toFixed(1) + ' ' + (h - padB) + ' Z';
    var dots = v.map(function (val, i){ return '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(val).toFixed(1) + '" r="' + (i === n - 1 ? 3.4 : 2.2) + '" fill="' + (opts.color || '#2f4bff') + '"/>'; }).join('');
    var grid = [0, .5, 1].map(function (p){
      var yy = padT + p * (h - padT - padB);
      return '<line x1="' + padL + '" y1="' + yy.toFixed(1) + '" x2="' + (w - padR) + '" y2="' + yy.toFixed(1) + '" stroke="#eef1f8" stroke-width="1"/>';
    }).join('');
    var xl = (labels || []).map(function (l, i){
      return '<text x="' + x(i).toFixed(1) + '" y="' + (h - 5) + '" text-anchor="middle" font-size="9" fill="#98a1b5" font-weight="700">' + U.esc(l) + '</text>';
    }).join('');
    var yl = [min, Math.round((min + max) / 2), max].map(function (val, i){
      var yy = padT + (1 - i / 2) * (h - padT - padB);
      return '<text x="' + (padL - 6) + '" y="' + (yy + 3).toFixed(1) + '" text-anchor="end" font-size="9" fill="#98a1b5" font-weight="700">' + val + '</text>';
    }).join('');
    return '<svg class="chart" viewBox="0 0 ' + w + ' ' + h + '" width="100%" role="img" aria-label="추이 차트">' +
      '<defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + (opts.color || '#2f4bff') + '" stop-opacity=".16"/><stop offset="1" stop-color="' + (opts.color || '#2f4bff') + '" stop-opacity="0"/></linearGradient></defs>' +
      grid + '<path d="' + area + '" fill="url(#ga)"/>' + '<path d="' + pts + '" fill="none" stroke="' + (opts.color || '#2f4bff') + '" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>' +
      dots + xl + yl + '</svg>';
  },
  bars: function (series, labels){
    var w = 520, h = 150, padB = 22, padT = 10, n = labels.length;
    var max = Math.max.apply(null, series.a.concat(series.b));
    var bw = (w - 20) / n;
    var bar = function (val, i, color, off){
      var bh = (val / max) * (h - padT - padB);
      return '<rect x="' + (10 + i * bw + off) + '" y="' + (h - padB - bh).toFixed(1) + '" width="' + (bw * 0.32).toFixed(1) + '" height="' + bh.toFixed(1) + '" rx="3" fill="' + color + '"/>';
    };
    var a = series.a.map(function (v, i){ return bar(v, i, '#2f4bff', bw * 0.16); }).join('');
    var b = series.b.map(function (v, i){ return bar(v, i, '#c9d3f0', bw * 0.52); }).join('');
    var xl = labels.map(function (l, i){ return '<text x="' + (10 + i * bw + bw / 2).toFixed(1) + '" y="' + (h - 5) + '" text-anchor="middle" font-size="9" fill="#98a1b5" font-weight="700">' + U.esc(l) + '</text>'; }).join('');
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" role="img" aria-label="월별 실적">' + a + b + xl + '</svg>';
  }
};

var ViewAdmin = {
  /* ------------------------------------------------------------------- KPI */
  kpiRow: function (){
    var apps = Store.state.applications;
    var now = new Date();
    var thisMonth = apps.filter(function (a){
      var d = U.parseISO(a.appliedAt);
      return d && d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
    });
    var decided = apps.filter(function (a){ return ['selected', 'visited', 'submitted', 'passed', 'fix', 'noshow'].indexOf(a.status) >= 0; });
    var rate = apps.length ? Math.round(decided.length / apps.length * 100) : 0;
    var upcoming = apps.filter(function (a){
      var d = U.parseISO(a.visitAt);
      return d && d >= U.today() && d <= U.addDays(U.today(), 7) && ['selected', 'visited'].indexOf(a.status) >= 0;
    }).length;
    var pending = Store.state.reviews.filter(function (r){ return r.adminStatus === 'submitted'; }).length;
    var manner = CREATORS.reduce(function (s, c){ return s + c.manner; }, 0) / CREATORS.length;
    var kpi = function (label, val, unit, delta, up, spark, plain){
      return '<div class="kpi"><span>' + label + '</span><b>' + val + (unit ? '<em>' + unit + '</em>' : '') + '</b>' +
        (delta ? '<span class="delta ' + (plain ? 'flat' : (up ? 'up' : 'down')) + '">' + (plain ? '' : icon(up ? 'arrowUp' : 'arrowDown')) + delta + '</span>' : '') +
        (spark ? Charts.spark(spark, up ? '#0b9b6b' : '#d93a3a') : '') + '</div>';
    };
    return '<div class="kpi-row">' +
      kpi('이번 달 신청', U.fmtNum(thisMonth.length), '건', '+12%', true, MONTHLY.applications) +
      kpi('선정률', rate, '%', '+4.2%p', true, MONTHLY.selected) +
      kpi('7일 내 방문 예정', upcoming, '건') +
      kpi('검수 대기', pending, '건', pending > 2 ? '확인 필요' : '원활', false, null, true) +
      kpi('평균 매너 점수', manner.toFixed(2), '', '전월 대비 +0.05', true) +
    '</div>';
  },

  /* ------------------------------------------------------------- 신청 관리 */
  baseRows: function (){
    var f = App.adminApps;
    return Store.state.applications.filter(function (a){
      if (f.campaign && a.campaignId !== f.campaign) return false;
      if (f.brand) { var cc = Store.campaign(a.campaignId); if (!cc || cc.brand !== f.brand) return false; }
      if (f.status && a.status !== f.status) return false;
      if (f.media && a.media !== f.media) return false;
      return true;
    });
  },
  rows: function (){
    var f = App.adminApps;
    var rows = ViewAdmin.baseRows().map(function (a){ return { app: a, match: Store.matchOf(a) }; });
    if (f.matchGrade === 'A') rows = rows.filter(function (r){ return r.match.grade === 'A'; });
    else if (f.matchGrade === 'B') rows = rows.filter(function (r){ return r.match.grade !== 'C'; });
    var sort = f.sort || 'score';
    rows.sort(function (x, y){
      if (sort === 'scoreAsc') return x.match.score - y.match.score || String(y.app.appliedAt).localeCompare(String(x.app.appliedAt));
      if (sort === 'recent') return String(y.app.appliedAt).localeCompare(String(x.app.appliedAt)) || y.match.score - x.match.score;
      return y.match.score - x.match.score || String(y.app.appliedAt).localeCompare(String(x.app.appliedAt));
    });
    return rows;
  },
  matchCounts: function (){
    var c = { A: 0, B: 0, C: 0, total: 0, sum: 0 };
    ViewAdmin.baseRows().forEach(function (a){
      var m = Store.matchOf(a);
      c[m.grade]++;
      c.total++;
      c.sum += m.score;
    });
    c.avg = c.total ? Math.round(c.sum / c.total) : 0;
    return c;
  },
  /* 점수 배지 + 등급 + 한 줄 사유 */
  matchCell: function (a, m){
    return '<div class="match-cell">' +
      '<button class="match-pill ' + m.meta.tone + '" data-act="matchDetail" data-id="' + a.id + '" title="항목별 매칭 점수 보기" aria-label="' + U.esc((Store.creator(a.creatorId) || {}).name || '') + ' 매칭 ' + m.score + '점 ' + m.grade + '등급 상세">' +
        '<b>' + m.score + '</b><span class="mu">점</span><i class="mg">' + m.grade + '</i></button>' +
      '<div class="cell-sub match-why">' + ViewAdmin.matchReason(m) + '</div>' +
    '</div>';
  },
  matchReason: function (m){
    if (!m.parts.length) return '<span class="mw-muted">산출 정보 없음</span>';
    return m.parts.map(function (p){
      return '<span class="mw' + (p.neg ? ' neg' : '') + '">' + U.esc(p.t) + '</span>';
    }).join('<span class="sep">·</span>');
  },
  /* 항목별 점수 내역 */
  matchPanel: function (a, m){
    return '<div class="match-hero ' + m.meta.tone + '">' +
        '<div class="mh-score"><b>' + m.score + '</b><span>점</span></div>' +
        '<div class="mh-meta"><div class="mh-grade"><i class="grade-seal ' + m.meta.tone + '">' + m.grade + '</i>' +
          '<b>' + m.meta.label + '</b><span>' + m.meta.desc + '</span></div>' +
          '<div class="mh-why">' + ViewAdmin.matchReason(m) + '</div></div>' +
      '</div>' +
      '<div class="match-bars">' + m.groups.map(function (g){
        var pct = g.max ? Math.round(g.got / g.max * 100) : 0;
        return '<div class="mb-row">' +
          '<div class="mb-head"><span class="mb-label">' + icon(g.icon) + g.label + '<em>' + g.desc + '</em></span>' +
          '<span class="mb-score">' + g.got + '<i>/' + g.max + '</i></span></div>' +
          '<div class="mb-track"><span class="mb-fill ' + m.meta.tone + '" style="width:' + pct + '%"></span></div>' +
          '<div class="mb-items">' + g.items.map(function (it){
            var hideDetail = it.max === 0 && it.got === 0;
            return '<span class="mb-item' + (it.got < 0 ? ' minus' : '') + '">' + U.esc(it.label) +
              ' <b>' + (it.got > 0 ? '+' : '') + it.got + '</b>' + (it.max ? '<i>/' + it.max + '</i>' : '') +
              (hideDetail ? '' : ' <span>· ' + U.esc(it.detail) + '</span>') + '</span>';
          }).join('') + '</div></div>';
      }).join('') + '</div>';
  },
  matchDetail: function (a, m){
    var cr = Store.creator(a.creatorId) || {};
    var c = Store.campaign(a.campaignId) || {};
    var br = a.branchId ? Store.branchOf(c, a.branchId) : null;
    var g = Store.grade(cr.grade);
    return '<div class="settings-body">' +
      '<div class="md-head">' +
        '<span class="avatar" style="width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,' + g.color + ',' + g.color2 + ')">' + U.esc(U.initials(cr.name)) + '</span>' +
        '<div style="min-width:0"><h2 style="font-size:17px;margin:0">' + U.esc(cr.name) + ' <span class="gb ' + g.key + '">' + g.badge + '</span></h2>' +

          }).join('') + '</div>' +
